    }
    async function ghPutData(data, sha) {
      const g = st.gh;
      const body = { message: 'Journal sync ' + new Date().toISOString(), content: textToB64(JSON.stringify(data)) };
      if (sha) body.sha = sha;
      const r = await ghFetch(`/repos/${g.repo}/contents/${DATA_FILE}`, { method: 'PUT', body: JSON.stringify(body) });
      if (r.status === 409 || r.status === 422) { const e = await ghErr(r); e.conflict = true; throw e; }
      if (!r.ok) throw await ghErr(r);
      return (await r.json()).content.sha;
    }
    async function ghPushImages() {
      const q = lsGet(LS.imgq) || [];
      if (!q.length) return;
      const finished = new Set();
      for (const id of q) {
        try {
          let blob = null;
          try { blob = await idbGet(id); } catch (e) { blob = null; }
          if (!blob) { finished.add(id); continue; }
          const b64 = bytesToB64(new Uint8Array(await blob.arrayBuffer()));
          const r = await ghFetch(`/repos/${st.gh.repo}/contents/shots/${id}.jpg`, { method: 'PUT', body: JSON.stringify({ message: 'Screenshot ' + id, content: b64 }) });
          if (r.ok || r.status === 422) finished.add(id);
        } catch (e) { /* stays queued */ }
      }
      // re-read: shots queued while this pass ran must stay queued
      const cur = lsGet(LS.imgq) || [];
      lsSet(LS.imgq, cur.filter((id) => !finished.has(id)));
      const done = new Set(lsGet(LS.imgdone) || []);
      for (const id of finished) done.add(id);
      lsSet(LS.imgdone, [...done].slice(-5000));
    }
    function ghSoon() {
      if (!st.gh || st.mode !== 'local') return;
      clearTimeout(ghTimer);
      ghTimer = setTimeout(() => ghSync('change'), 2500);
    }
    async function ghSync() {
      if (!st.gh || st.mode !== 'local') return false;
      if (ghBusy) { ghAgain = true; return false; }
      ghBusy = true; st.ghState = 'syncing'; notify();
      try {
        for (let attempt = 0; attempt < 4; attempt++) {
          const remote = await ghGetData();
          const local = Object.assign(snapshotAll(), { tomb });
          const merged = mergeData(local, remote.data);
          const cm = sig(canon(merged));
          tomb = merged.tomb;
          if (cm !== sig(canon(local))) { hydrate(merged); notify(); }
          saveLocal();
          if (remote.data && cm === sig(canon(remote.data))) break;
          try {
            await ghPutData(Object.assign({ format: 'vanguard-desk', version: 1, saved: new Date().toISOString() }, clean(Object.assign(snapshotAll(), { tomb }))), remote.sha);

          } catch (e) {
            if (e.conflict && attempt < 3) { await sleep(jitter(300, 1200)); continue; }

          }
        }

      } finally {
        ghBusy = false; notify();
        if (ghAgain) { ghAgain = false; setTimeout(() => ghSync('again'), 800); }
      }
    }
    // the first sync of a device that already has its own journal: the synced copy is the base,
    // and this device's accounts are matched onto the synced ones (same account # or same name and size)
    function adoptRemote(remote) {
      if (!remote || !remote.data || !remote.data.app) return null;
      const hasData = COLLS.some((c) => S[c].size > 0);
      if (!hasData) { S.app = null; tomb = {}; return 'adopted'; }
      const rApp = H.migrateApp(remote.data.app);
      const map = {};
      for (const la of (S.app ? S.app.accounts : [])) {
        if (rApp.accounts.some((r) => r.id === la.id)) continue;
        const m = rApp.accounts.find((r) => la.platformId && r.platformId === la.platformId)
          || rApp.accounts.find((r) => r.name === la.name && +r.size === +la.size && r.program === la.program);
        if (m) map[la.id] = m.id;
      }
      let moved = 0;
      for (const c of COLLS) {
        for (const [id, x] of [...S[c]]) {
          if (!map[x.acc]) continue;
          const y = Object.assign({}, x, { acc: map[x.acc] });
          if (c === 'days') {
            y.id = y.acc + '_' + y.day;
            S.days.delete(id); tomb['days/' + id] = stamp(x.updated);
          }
          y.updated = stamp(x.updated);
          S[c].set(y.id, y);
          if (c === 'trades') moved++;
        }
      }
      for (const id of Object.keys(map)) tomb['accounts/' + id] = stamp();
      const extra = (S.app ? S.app.accounts : []).filter((a) => !map[a.id] && !rApp.accounts.some((r) => r.id === a.id));
      rApp.accounts = rApp.accounts.concat(extra);
      rApp.updated = stamp(rApp.updated);
      S.app = rApp;
      saveLocal();
      return moved ? `moved ${moved}` : 'merged';
    }
    async function ghConnect(repo, token) {
      repo = String(repo || '').trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
      token = String(token || '').trim();
      if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) return { ok: false, msg: 'Repository should look like owner/name.' };
      if (token.length < 20) return { ok: false, msg: 'Paste the whole token.' };
      const prev = st.gh;
      st.gh = { repo, token };
      try {
        const r = await ghFetch(`/repos/${repo}`);
        if (!r.ok) throw await ghErr(r);
        const j = await r.json();
        if (j.private === false) { st.gh = prev; return { ok: false, msg: 'That repository is public. Use a private repository so your journal stays private.' }; }
        let note = '';
        if (lsGet(LS.ghrepo) !== repo) {
          const res = adoptRemote(await ghGetData());
          if (res && res.startsWith('moved')) note = ` Your ${res.slice(6)} trade(s) from this device were added to the matching account.`;
        }
        lsSet(LS.gh, st.gh);
        st.ghState = 'idle';
        startPoll();
        queueLocalShots();
        const ok = await ghSync('connect');
        return ok ? { ok: true, msg: 'Connected. This device now syncs with GitHub.' + note } : { ok: false, msg: st.ghError || 'Connected, but the first sync failed.' };
      } catch (e) {
        st.gh = prev;
        return { ok: false, msg: e.status === 401 ? 'GitHub rejected that token.' : e.status === 404 ? 'GitHub can’t find that repository with this token.' : (e.message || 'Could not reach GitHub.') };
      }
    }
    function ghDisconnect() { st.gh = null; st.ghState = 'off'; st.ghError = null; lsDel(LS.gh); notify(); }

    /* ---------- moving browser-only data into the synced journal ---------- */
    async function mergeLocalIntoCloud(local) {
      const res = { trades: { ok: 0, failed: 0 }, days: { ok: 0, failed: 0 }, events: { ok: 0, failed: 0 } };
      if (local.app) {
        S.app = S.app ? H.migrateApp(mergeApp(S.app, H.migrateApp(local.app))) : H.migrateApp(local.app);
        await saveApp(true);
      }
      for (const c of COLLS) {
        const list = [...sanitizeList(c, local[c]).values()].filter((x) => !S[c].has(x.id));
        res[c] = await putMany(c, list);
      }
      const failed = res.trades.failed + res.days.failed + res.events.failed;
      if (!failed) lsDel(LS.local);
      return Object.assign(res, { failed });
    }

    return {
      st, init, put, del, putMany, delMany, saveApp, flushOutbox, cacheSoon, snapshotAll, mergeLocalIntoCloud,
      saveImage, imageUrl, deleteImage, ghConnect, ghDisconnect, ghSync, sanitizeList, stamp,
      get mode() { return st.mode; },
    };
  }

  window.DeskStore = { create, mergeData, mergeApp, mergeDay };
})();

        <label class="field"><span>Daily DD limit on dashboard</span><input id="d-dl" inputmode="decimal" data-day-field="dailyLimit" value="${dlTyped ? esc(doc.dailyLimit) : ''}" placeholder="${t.dailyCalc.toFixed(2)}"><span class="hint">The app uses the tighter of this and ${money(t.dailyCalc)}.</span></label>

        <label class="field"><span>Balance on dashboard</span><input id="d-bal" inputmode="decimal" placeholder="${c.L.balance.toFixed(2)}"><span class="hint" id="d-bal-hint">Compare with the journal balance.</span></label>

  /* ================= SIZE ================= */
  function instOptions(selected) {
    const groups = {};
    for (const i of E.INSTRUMENTS) (groups[i.group] = groups[i.group] || []).push(i);
    return Object.entries(groups).map(([g, list]) => `<optgroup label="${g}">${list.map((i) => `<option value="${i.sym}" ${i.sym === selected ? 'selected' : ''}>${i.sym} · ${esc(i.name)}</option>`).join('')}</optgroup>`).join('');
  }
  function weightText(i) { return i.weight === 1 ? '1 mini' : i.weight === 0.2 ? '1/5 mini' : '1/10 mini'; }
  function viewSize(c) {
    const k = S.ui.calc, r = c.set.risk;
    const i = E.inst(k.sym) || E.inst('MES');
    const favs = c.set.favorites;
    const feeDefault = E.feePerSide(c.set, i.sym);
    const rates = i.group === 'Rates';
    return `
    <div class="split">
      <section class="card stack" id="calc-form">
        <div class="card-h" style="margin:0"><h2>Size a trade</h2><span class="tiny muted">Recalculates as you type</span></div>
        <div class="field"><span>Instrument</span>
          <div class="chips">${favs.map((s) => `<button type="button" class="chip sym" data-calc-sym="${esc(s)}" aria-pressed="${s === i.sym}">${esc(s)}</button>`).join('')}</div>
          <select id="c-sym" aria-label="All instruments">${instOptions(i.sym)}</select>
          <span class="hint" id="c-spec"></span>

          <div class="seg" role="group" aria-label="Stop input"><button type="button" data-calc-mode="price" aria-pressed="${k.mode !== 'ticks'}">Prices</button><button type="button" data-calc-mode="ticks" aria-pressed="${k.mode === 'ticks'}">Stop in ticks</button></div>
        </div>
        <div class="grid g3" ${k.mode === 'ticks' ? 'hidden' : ''} id="c-prices">
          <label class="field"><span>Entry</span><input id="c-entry" inputmode="decimal" data-calc="entry" value="${esc(k.entry)}" placeholder="${rates ? "110'16 or 110.5" : 'e.g. 5820.25'}"></label>
          <label class="field"><span>Stop</span><input id="c-stop" inputmode="decimal" data-calc="stop" value="${esc(k.stop)}" placeholder="${k.side === 'short' ? 'above entry' : 'below entry'}"></label>
          <label class="field"><span>Target <em class="muted">(optional)</em></span><input id="c-target" inputmode="decimal" data-calc="target" value="${esc(k.target)}" placeholder="optional"></label>
        </div>
        <div class="grid g2" ${k.mode === 'ticks' ? '' : 'hidden'} id="c-ticks">
          <label class="field"><span>Stop distance (ticks)</span><input id="c-stopticks" inputmode="decimal" data-calc="stopTicks" value="${esc(k.stopTicks)}" placeholder="e.g. 16"></label>
          <label class="field"><span>Target distance (ticks)</span><input id="c-targetticks" inputmode="decimal" data-calc="targetTicks" value="${esc(k.targetTicks)}" placeholder="optional"></label>
        </div>
        <label class="field"><span>Your risk for this trade ($)</span><input id="c-budget" inputmode="decimal" data-calc="budget" value="${esc(k.budget)}" placeholder="${esc(r.perTrade)}"><span class="hint">Default ${money0(r.perTrade)} from Setup. The account allows up to ${money0(c.L.mtl)} per position.</span></label>
        ${c.openUsed ? `<div class="banner warn small"><span>Today shows an open position (${smoney(c.openUsed)}). ${c.openUsed < 0 ? `Its ${money(-c.openUsed)} loss is already taken off your room.` : ''} Enter its loss to the stop below so the calculator counts it fully.</span></div>` : ''}
        <details ${k.openMinis || k.openMicros || k.sameRisk || k.otherRisk || c.openUsed ? 'open' : ''}>
          <summary>Already in a trade? Slippage, fees, open positions</summary>
          <div class="grid g3" style="margin-top:10px">
            <label class="field"><span>Already open: minis</span><input id="c-ominis" inputmode="decimal" data-calc="openMinis" value="${esc(k.openMinis)}" placeholder="0"></label>
            <label class="field"><span>Already open: micros</span><input id="c-omicros" inputmode="decimal" data-calc="openMicros" value="${esc(k.openMicros)}" placeholder="0"><span class="hint">Count each SIL as 2.</span></label>
            <span></span>
            <label class="field"><span>Same market &amp; direction: loss from entry to stop ($)</span><input id="c-same" inputmode="decimal" data-calc="sameRisk" value="${esc(k.sameRisk)}" placeholder="0"><span class="hint">Adding to a position? It and this add count as one trade for the ${money0(c.L.mtl)} cap, mini and micro together (ES + MES).</span></label>
            <label class="field"><span>Other open positions: loss from entry to stop ($)</span><input id="c-other" inputmode="decimal" data-calc="otherRisk" value="${esc(k.otherRisk)}" placeholder="0"><span class="hint">Counts against the daily and trailing room.</span></label>
            <span></span>
            <label class="field"><span>Slippage on the stop (ticks)</span><input id="c-slip" inputmode="decimal" data-calc="slip" value="${esc(k.slip)}" placeholder="${esc(r.slipTicks)}"></label>
            <label class="field"><span>Fee per contract per side</span><input id="c-fee" inputmode="decimal" data-calc="fee" value="${esc(k.fee)}" placeholder="${feeDefault.toFixed(2)}"><span class="hint">Resets when you change instrument.</span></label>
            <label class="field"><span>Safety buffer (%)</span><input id="c-safety" inputmode="decimal" data-calc="safety" value="${esc(k.safety)}" placeholder="${esc(r.safetyPct)}"></label>
          </div>
          <p class="tiny muted" style="margin-top:8px">The safety buffer keeps every rule limit that much below the real line, so a gap or a slow fill doesn't breach you.</p>
        </details>
        <div class="row"><button class="btn ghost sm" data-action="calc-clear">Clear prices</button></div>
      </section>
      <section class="calc-out" id="calc-out" aria-live="polite"></section>
    </div>`;
  }
  function calcInputs(c) {
    const k = S.ui.calc, r = c.set.risk;
    const v = (x, d) => (numOrNull(x) == null ? d : Math.max(0, numOrNull(x)));
    const sameRisk = v(k.sameRisk, 0), otherRisk = v(k.otherRisk, 0);
    // a known open loss is at least that far from its stop, so it always counts against the rooms
    const openLoss = Math.max(0, -(c.openUsed || 0));
    const openRisk = Math.max(sameRisk + otherRisk, openLoss);
    const todayNet = c.L.todayRow.net;
    // rooms are measured from the balance: if the open stops hit, open profit or loss turns into the stop loss
    const dailyRoom = c.L.balance - c.L.todayRow.dailyLimit;
    const trailRoom = c.L.balance - c.R.floor;
    const extra = [];
    if (+r.dailyStop > 0) extra.push({ key: 'pstop', label: 'Your daily stop', dollars: +r.dailyStop + todayNet - openRisk });
    return {
      sym: k.sym, side: k.side === 'short' ? 'short' : 'long', mode: k.mode === 'ticks' ? 'ticks' : 'price',
      entry: priceOf(k.entry, k.sym), stop: priceOf(k.stop, k.sym), target: priceOf(k.target, k.sym),
      stopTicks: numOrNull(k.stopTicks), targetTicks: numOrNull(k.targetTicks),
      slipTicks: v(k.slip, r.slipTicks), feeSide: v(k.fee, E.feePerSide(c.set, k.sym)),
      budget: v(k.budget, r.perTrade), safetyPct: clamp(v(k.safety, r.safetyPct), 0, 50),
      maxTradeLoss: c.L.mtl, dailyRoom, trailRoom, openRisk, sameRisk,
      openMiniEq: v(k.openMinis, 0) + v(k.openMicros, 0) / 10,
      maxMinis: c.acc.rules.maxMinis, extraCaps: extra,
      todayNet, bestDay: Math.max(0, c.P.best.net), profitWindow: c.P.tradedProfit, bestDayPct: c.acc.rules.bestDayPct,
    };
  }
  function updateCalc() {
    const out = $('#calc-out');
    if (!out) return;
    const c = ctx();
    const k = S.ui.calc;
    const i = E.inst(k.sym) || E.inst('MES');
    const spec = $('#c-spec');
    const mg = MARGINS[i.sym];
    if (spec) spec.innerHTML = `${esc(i.name)} · 1 tick = ${tickFmt(i)} = <b>${money(i.tv)}</b> · 1 point = ${money(i.pv)} · counts as ${weightText(i)}${mg ? ` · margin about ${money0(mg)}` : ''}`;
    const p = calcInputs(c);
    const s = E.sizeTrade(p);
    if (!s.ok) {
      const rateHint = i.group === 'Rates' && k.mode !== 'ticks' && (k.entry || k.stop) ? ' Rates take decimals (110.5) or 32nds (110\'16).' : '';
      out.innerHTML = `<div class="card empty"><b>${esc(s.errors[0] || 'Enter your trade')}</b><span>Pick the instrument, then type the entry and stop (or the stop in ticks). The answer shows the most contracts every limit allows.${rateHint}</span>${limitsLine(c, p)}</div>`;
      return;
    }
    const pair = PAIRS[i.sym];
    let pairLine = '';
    if (pair) {
      const pi = E.inst(pair);
      const ps = E.sizeTrade(Object.assign({}, p, { sym: pair, feeSide: E.feePerSide(c.set, pair), mode: 'ticks', stopTicks: (s.stopTicks * i.tick) / pi.tick, targetTicks: s.targetTicks != null ? (s.targetTicks * i.tick) / pi.tick : null }));
      if (ps.ok) pairLine = `<div class="small muted">Same stop on <b>${pair}</b>: up to <b class="num">${ps.qty}</b> contract${ps.qty === 1 ? '' : 's'} (${money(ps.perContract)} each).</div>`;
    }
    const maxN = Math.max(1, ...s.caps.map((x) => Math.min(x.n, 99)));
    const capsHTML = s.caps.map((x) => `
      <div class="cap ${x.binding ? 'binding' : ''}">
        <span>${esc(x.label)}${x.rule === false ? ' <span class="tiny muted">(yours)</span>' : ''}</span>
        <span class="tiny muted num">${x.dollars == null ? '' : money(x.dollars)}</span>
        <span class="n">${x.n}</span>
        <div class="bar ${x.binding ? 'acc' : ''}"><i style="width:${clamp((Math.min(x.n, 99) / maxN) * 100, 0, 100)}%"></i></div>
      </div>`).join('');
    if (mg && s.qty && s.qty * mg > c.R.equity) s.warnings.push(`Upcomers X margin for ${s.qty} ${i.sym} is about ${money0(s.qty * mg)}, more than your ${money0(c.R.equity)} equity. The platform may reject the order${pair ? `; use ${pair}` : ''}.`);
    // sizing up straight after a loss is the classic tilt pattern (and martingale is prohibited)
    const tt = todayTrades(c);
    const lastT = tt[tt.length - 1];
    if (s.qty && lastT && c.calcById.get(lastT.id).net < 0) {
      const lastRisk = c.calcById.get(lastT.id).risk;
      const bigger = lastT.sym === i.sym ? s.qty > +lastT.qty : lastRisk != null && s.worstCase > lastRisk * 1.25;
      if (bigger) s.warnings.push('Your last trade was a loss and this is bigger. Sizing up to win it back is how accounts breach, and martingale is prohibited.');
    }
    const roomNow = Math.min(p.dailyRoom, p.trailRoom) - p.openRisk;
    const after = roomNow - s.worstCase;
    const lossesLeft = s.worstCase > 0 ? Math.floor(Math.max(0, after) / s.worstCase) : null;
    // early on every green day is 100% of profit; only speak up once a payout is within reach
    const bestLine = s.bestDayShare != null && c.P.tradedProfit >= c.P.minProfit ? `<div class="small ${s.bestDayShare > c.acc.rules.bestDayPct ? 'warn' : 'muted'}">If the target hits, your best day would be <b>${pct(s.bestDayShare)}</b> of your payout-window profit (limit ${esc(c.acc.rules.bestDayPct)}%).${s.bestDayShare > c.acc.rules.bestDayPct ? ' That delays a payout, it does not breach the account.' : ''}</div>` : '';
    const lb = fin(s.ladderBudget) ? s.ladderBudget : null;
    const ladder = s.ladder && s.ladder.length ? `
      <section class="card">
        <div class="card-h"><h3>Widest stop for each size</h3><span class="tiny muted">${lb != null ? `stays under ${money(lb)} (${esc(s.ladderBindingLabel || 'your tightest limit')}) incl. slippage and fees` : ''}</span></div>
        <div class="tw"><table class="t"><thead><tr><th>Contracts</th><th class="r">Ticks</th><th class="r">Points</th>${s.ladder[0].price != null ? '<th class="r">Stop price</th>' : ''}<th class="r">Loss if stopped</th></tr></thead>
        <tbody>${s.ladder.map((row) => `<tr class="${row.n === s.qty ? 'hl' : ''}"><td class="num">${row.n} ${esc(i.sym)}</td><td class="r num">${row.ticks}</td><td class="r num">${row.points}</td>${row.price != null ? `<td class="r num">${pxFmt(row.price, i.sym)}</td>` : ''}<td class="r num">${money(fin(row.worst) ? row.worst : row.dollars)}</td></tr>`).join('')}</tbody></table></div>
      </section>` : '';
    out.innerHTML = `
      <section class="answer ${s.qty ? '' : 'zero'}">
        <div class="eyebrow">${s.qty ? 'Trade at most' : 'Do not take this trade'}</div>
        <div class="qty">${s.qty} <small>${esc(i.sym)} ${p.side === 'short' ? 'short' : 'long'}</small></div>
        <div class="small" style="margin-top:6px">Stop ${s.stopTicks} ticks (${s.stopPoints} pts) · <b>${money(s.perContract)}</b> per contract incl. ${esc(p.slipTicks)} tick slippage + fees</div>
        ${s.qty ? `<div class="small">Loss if stopped: <b class="num">${money(s.worstCase)}</b> · ${pct(s.pctOfMtl, 0)} of the ${money0(c.L.mtl)} max trade loss${p.sameRisk ? `, ${money(s.worstCase + p.sameRisk)} with the position you already have` : ''}</div>` : ''}
        ${s.warnings.map((w) => `<div class="small" style="margin-top:6px"><b>${esc(w)}</b></div>`).join('')}
        ${s.reward != null && s.qty ? `<div class="small" style="margin-top:6px">Target: <b class="num good">${smoney(s.reward)}</b> after fees · reward:risk <b>${esc(s.rr)}</b> after costs · you need to win ${pct(s.breakevenWinRate, 0)} of these to break even</div>` : ''}
        ${s.qty ? `<div class="small" style="margin-top:6px">If this and your open stops all hit, you'd have <b class="num">${money(after)}</b> of room left${lossesLeft != null ? `, enough for ${plural(lossesLeft, 'more loss', 'more losses')} this size` : ''}.</div>` : ''}
        ${pairLine}
        ${bestLine}
        ${s.qty && !ro() ? `<div class="row" style="margin-top:10px"><button class="btn primary sm" data-action="calc-log">Log this trade</button></div>` : ''}
      </section>
      <section class="card">
        <div class="card-h"><h3>Every limit, smallest wins</h3><span class="tiny muted">contracts allowed</span></div>
        <div class="caps">${capsHTML}</div>
      </section>
      ${ladder}`;
  }
  function limitsLine(c, p) {
    return `<div class="small muted">Right now: ${money(p.dailyRoom)} daily room · ${money(p.trailRoom)} above the trailing floor · ${money0(c.L.mtl)} max per position · ${esc(c.acc.rules.maxMinis)} minis / ${esc(c.acc.rules.maxMicros)} micros.</div>`;
  }

  /* ================= JOURNAL ================= */
  function shotsHTML(shots, removable) {
    return (shots || []).map((s, k) => `<span style="position:relative"><img data-shot="${esc(s.id)}" data-src="${esc(s.src || '')}" alt="Trade screenshot ${k + 1}"${s.src === 'asset' || (!s.src && Store.mode === 'cloud') ? ` src="/_blob/${esc(s.id)}"` : ''}>${removable ? `<button type="button" class="btn sm" style="position:absolute;top:4px;right:4px;padding:0 6px" data-shot-del="${k}" aria-label="Remove screenshot">×</button>` : ''}</span>`).join('');
  }
  async function hydrateShots(root) {
    for (const img of $$('img[data-shot]:not([src])', root)) {
      const url = await Store.imageUrl({ id: img.dataset.shot, src: img.dataset.src || undefined });
      if (url) { img.src = url; img.dataset.zoom = url; } else img.alt = 'Screenshot not on this device';
    }
    for (const img of $$('img[data-shot][src]', root)) img.dataset.zoom = img.getAttribute('src');
  }
  function tradeRowHTML(c, t) {
    const k = c.calcById.get(t.id) || E.tradeCalc(t, c.set);
    const flags = [];
    if (fin(k.gross) && k.gross <= -c.L.mtl + 0.005) flags.push('<span class="badge bad">Max loss</span>');
    else if (fin(k.gross) && k.gross <= -c.L.mtl * 0.9) flags.push('<span class="badge warn">Near max loss</span>');
    if (t.rollover) flags.push('<span class="badge plain">Rollover</span>');
    else if (+c.acc.rules.minHoldSec > 0 && k.holdSec != null && k.holdSec < c.acc.rules.minHoldSec) flags.push(`<span class="badge warn">Under ${Math.round(c.acc.rules.minHoldSec / 60)} min</span>`);
    if (t.followedPlan === false) flags.push('<span class="badge warn">Off plan</span>');
    (t.mistakes || []).slice(0, 2).forEach((m) => flags.push(`<span class="badge plain">${esc(m)}</span>`));
    const prices = fin(t.entry) && fin(t.exit) ? `${esc(t.qty)} @ ${pxFmt(t.entry, t.sym)} → ${pxFmt(t.exit, t.sym)}` : `${plural(+t.qty || 0, 'contract')}`;
    return `<div class="trade" data-edit="${esc(t.id)}" role="button" tabindex="0" aria-label="Edit ${esc(t.sym)} trade">
      <span class="tm tiny muted">${fmtTime(k.closeMs)}<br>${fmtET(k.closeMs)}</span>
      <span><span class="sym">${esc(t.sym)}</span><br><span class="badge ${t.side === 'short' ? 'short' : 'long'}">${t.side === 'short' ? 'SHORT' : 'LONG'}</span></span>
      <span class="mid"><span class="px">${prices}${k.holdSec != null ? ` · ${fmtHold(k.holdSec)}` : ''}</span>
        <span class="meta">${t.setup ? `<span>${esc(t.setup)}</span>` : ''}${t.grade ? `<span class="badge plain">${esc(t.grade)}</span>` : ''}${flags.join('')}${(t.shots || []).length ? `<span class="badge plain">${plural(t.shots.length, 'image')}</span>` : ''}</span></span>
      <span class="pnl ${tone(k.net)}">${smoney(k.net)}<small>${k.R != null ? (k.R > 0 ? '+' : '') + esc(k.R) + 'R' : ''}</small></span>
    </div>`;
  }
  function journalFiltered(c) {
    const u = S.ui;
    const today = c.L.today;
    let from = null;
    if (u.jRange === 'today') from = today;
    else if (u.jRange === 'week') { const wd = E.weekdayOf(today); from = E.addDays(today, -((wd + 6) % 7)); }
    else if (u.jRange === 'month') from = today.slice(0, 8) + '01';
    else if (u.jRange === '30') from = E.addDays(today, -30);
    const q = (u.jSearch || '').toLowerCase().trim();
    return c.trades.filter((t) => {
      const k = c.calcById.get(t.id);
      if (!k.closeMs) return false;
      const d = E.tradingDay(k.closeMs, c.acc.rules.resetHourET);
      if (from && d < from) return false;
      if (u.jSym && t.sym !== u.jSym) return false;
      if (u.jSetup && (t.setup || '') !== u.jSetup) return false;
      if (u.jResult === 'win' && !(k.net > 0)) return false;
      if (u.jResult === 'loss' && !(k.net < 0)) return false;
      if (u.jResult === 'offplan' && t.followedPlan !== false) return false;
      if (u.jResult === 'mistake' && !(t.mistakes && t.mistakes.length)) return false;
      if (q && !`${t.notes || ''} ${t.setup || ''} ${(t.mistakes || []).join(' ')} ${t.sym}`.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => c.calcById.get(b.id).closeMs - c.calcById.get(a.id).closeMs);
  }
  function viewJournal(c) {
    const u = S.ui, set = c.set;
    const list = journalFiltered(c);
    const syms = [...new Set([...c.trades.map((t) => t.sym), u.jSym].filter(Boolean))].sort();
    const setups = [...new Set([...set.setups, ...c.trades.map((t) => t.setup), u.jSetup].filter(Boolean))];
    const byDay = new Map();
    for (const t of list) {
      const d = E.tradingDay(c.calcById.get(t.id).closeMs, c.acc.rules.resetHourET);
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(t);
    }
    const dayRows = new Map(c.L.days.map((d) => [d.day, d]));
    const days = [...byDay.keys()];
    const shownDays = days.slice(0, u.jLimit);
    const totalNet = list.reduce((s, t) => s + c.calcById.get(t.id).net, 0);
    const qi = E.inst(S.ui.qSym) || E.inst(set.favorites[0]) || E.inst('MES');
    const filtered = u.jRange !== 'all' || u.jSym || u.jSetup || u.jResult || u.jSearch;
    return `
    ${bannersHTML(c)}
    ${ro() ? '' : `<section class="card">
      <div class="card-h"><h2>Quick add</h2><span class="tiny muted">Just the result, logged as closed now. Use “Log trade” for the full entry.</span></div>
      <div class="quick">
        <label class="field"><span>Instrument</span><select id="q-sym">${instOptions(qi.sym)}</select></label>
        <div class="field"><span>Side</span><div class="seg long-short" role="group" aria-label="Side"><button type="button" data-q-side="long" data-v="long" aria-pressed="${u.qSide !== 'short'}">Long</button><button type="button" data-q-side="short" data-v="short" aria-pressed="${u.qSide === 'short'}">Short</button></div></div>
        <label class="field"><span>Contracts</span><input id="q-qty" inputmode="numeric" value="${esc(S.ui.qQty || 1)}"></label>
        <div class="field"><span>Net P&amp;L ($)</span><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="seg" role="group" aria-label="Win or loss"><button type="button" data-q-win="1" aria-pressed="${u.qWin !== false}">Win</button><button type="button" data-q-win="0" aria-pressed="${u.qWin === false}">Loss</button></div><input id="q-net" inputmode="decimal" placeholder="62.50" style="min-width:0"></div></div>
        <button class="btn primary" data-action="quick-add">Add</button>
      </div>
    </section>`}
    <section class="card">
      <div class="card-h">
        <h2>Journal</h2>
        <div class="row">${ro() ? '' : '<button class="btn sm" data-action="import">Import CSV</button>'}<button class="btn sm" data-action="export-csv">Export CSV</button>${ro() ? '' : '<button class="btn sm primary" data-action="new-trade">+ Log trade</button>'}</div>
      </div>
      <div class="filters">
        <select id="f-range" aria-label="Date range">${[['all', 'All time'], ['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['30', 'Last 30 days']].map(([v, l]) => `<option value="${v}" ${u.jRange === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select id="f-sym" aria-label="Instrument"><option value="">All instruments</option>${syms.map((s) => `<option value="${esc(s)}" ${u.jSym === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <select id="f-setup" aria-label="Setup"><option value="">All setups</option>${setups.map((s) => `<option value="${esc(s)}" ${u.jSetup === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <select id="f-result" aria-label="Result">${[['', 'Wins and losses'], ['win', 'Winners'], ['loss', 'Losers'], ['offplan', 'Off plan'], ['mistake', 'With a mistake']].map(([v, l]) => `<option value="${v}" ${u.jResult === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <input id="f-search" type="search" placeholder="Search notes" value="${esc(u.jSearch)}" aria-label="Search notes">
        ${filtered ? '<button class="btn sm ghost" data-action="clear-filters">Clear filters</button>' : ''}
        <span class="small muted">${plural(list.length, 'trade')} · <b class="${tone(totalNet)} num">${smoney(totalNet)}</b></span>
      </div>
      ${list.length ? shownDays.map((d) => {
        const dr = dayRows.get(d);
        const ts = byDay.get(d);
        const dn = ts.reduce((s, t) => s + c.calcById.get(t.id).net, 0);
        const fl = dr ? dr.flags.filter((f) => ['daily', 'trail'].includes(f.type)) : [];
        return `<div class="day-h"><span><b>${esc(fmtDay(d))}</b> <span class="tiny muted">${plural(ts.length, 'trade')}</span> ${dr && dr.qualifying && dr.done ? `<span class="badge good" title="Closed at least ${money0(c.L.qualMin)} up">Qualifying day</span>` : ''} ${fl.map((f) => `<span class="badge bad" title="${esc(f.msg)}">${f.type === 'daily' ? 'Daily limit hit' : 'Floor hit'}</span>`).join('')}</span><span class="num ${tone(dn)}"><b>${smoney(dn)}</b></span></div>${ts.map((t) => tradeRowHTML(c, t)).join('')}`;
      }).join('') : `<div class="empty"><b>${c.trades.length ? 'No trades match these filters' : 'Your journal is empty'}</b><span>${c.trades.length ? 'Clear the filters to see everything.' : 'Log a trade with the button, add a quick result above, or import a CSV of fills from Upcomers X.'}</span>${filtered ? '<button class="btn" data-action="clear-filters">Clear filters</button>' : ''}</div>`}
      ${days.length > shownDays.length ? `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-action="more-days">Show older days</button></div>` : ''}
    </section>`;
  }

  /* ================= PAYOUT ================= */
  function viewPayout(c) {
    const P = c.P, rules = c.acc.rules;
    const req = numOrNull(S.ui.payReq);
    const amount = req != null ? req : P.maxRequest;
    const net = E.payoutNet(amount, rules, S.ui.payMethod);
    const balAfter = c.L.balance - amount;
    const floor = c.R.floor;
    const buffer = balAfter - floor;
    const overCap = P.cap != null && amount > P.cap + 1e-9;
    const overAvail = amount > P.available + 1e-9;
    const caps = rules.payoutCaps || [];
    const payouts = c.events.filter((e) => e.type === 'payout');
    const adj = c.events.filter((e) => e.type === 'adjust');
    const qd = P.qualDays;
    const reqHTML = P.reqs.map((r) => {
      let have = '';
      if (r.key === 'days' || r.key === 'days-since') have = `<b class="num">${esc(r.have)} / ${esc(r.need)}</b>`;
      else if (r.money) have = `<b class="num">${money(r.have)}</b> <span class="tiny muted">of ${money0(r.need)}</span>`;
      else if (r.pct) have = r.have == null ? '<span class="tiny muted">no profit yet</span>' : `<b class="num">${pct(r.have)}</b>`;
      const mark = r.info ? ['', 'i'] : r.manual ? ['', '?'] : r.met ? ['ok', '✓'] : ['no', '·'];
      const note = r.key === 'best' && P.best.day ? `Best day ${money(P.best.net)} on ${esc(fmtDay(P.best.day))}` : r.manual ? 'Check this yourself before you request.' : r.info ? 'For your information. It does not block the payout here.' : r.key === 'days' && P.qualToday && P.qualToday.onTrack ? `Today is on track (${smoney(P.qualToday.net)} so far). It counts once the session closes at 5:00 PM ET.` : '';
      return `<div class="req"><span class="tickmark ${mark[0]}">${mark[1]}</span><span>${esc(r.label)}${note ? `<div class="tiny muted">${note}</div>` : ''}</span><span>${have}</span></div>`;
    }).join('');
    const bestHelp = P.best.net > 0 && !(P.reqs.find((r) => r.key === 'best') || {}).met
      ? `To bring your best day within ${esc(rules.bestDayPct)}%, you need <b class="num">${money(P.best.net / (rules.bestDayPct / 100))}</b> of total profit in this window, which is <b class="num">${money(P.needMore)}</b> more, earned without beating that day.`
      : P.best.net > 0 ? `Your best day is within the ${esc(rules.bestDayPct)}% limit.` : 'No profitable day in this payout window yet.';
    const countNote = P.qualCountUtc != null && P.qualCountCme != null && P.qualCountUtc !== P.qualCountCme ? `<p class="tiny muted">Counted by the 5 PM ET trading day you have ${P.qualCountCme}; counted by calendar day (UTC) you have ${P.qualCountUtc}. The app uses the lower number until Upcomers confirms which clock they use.</p>` : '';
    return `
    ${bannersHTML(c)}
    <section class="card">
      <div class="card-h"><div><h2>Payout readiness</h2><div class="small muted">${P.first ? 'First payout: needs qualifying days plus the standing rules.' : `Since your last payout${c.L.lastPayoutDay ? ' on ' + esc(fmtDay(c.L.lastPayoutDay)) : ''}.`}</div></div>
        <span class="pill ${P.eligible ? 'clear' : 'caution'}"><i></i>${P.eligible ? 'Eligible to request' : 'Not yet'}</span></div>
      ${reqHTML}
    </section>
    <div class="split">
      <section class="card stack">
        <h2>Best day rule (${esc(rules.bestDayPct)}%)</h2>
        <p class="small">${bestHelp}</p>
        ${P.todayCap > 0 ? `<p class="small">To keep today from becoming the problem, stop adding profit after about <b class="num">${money(P.todayCap)}</b> today${fin(P.todayProfit) && P.todayProfit > 0 ? ` (you're at ${smoney(P.todayProfit)})` : ''}. A bigger day breaks no rule; it only pushes your payout back.</p>` : ''}
        ${+rules.firstPayoutDays > 0 ? `<div><div class="eyebrow" style="margin-bottom:6px">Qualifying days (${money0(c.L.qualMin)}+ profit, closed sessions)</div>${qd.length ? `<div class="chips">${qd.map((d) => `<span class="badge good">${esc(fmtDay(d.day))} · ${smoney(d.net)}</span>`).join('')}</div>` : `<p class="small muted">None yet. A day counts when the session closes at least ${money0(c.L.qualMin)} up. Days don't need to be in a row. The articles say this is for the first payout only; the app keeps counting after that in case the dashboard asks again.</p>`}${countNote}</div>` : ''}
      </section>
      <section class="card stack">
        <h2>What you would receive</h2>
        <p class="small">This would be payout <b>#${P.payoutNo}</b>. ${P.cap != null ? `Its cap is <b class="num">${money0(P.cap)}</b>.` : 'Per-payout caps have lifted.'} You have <b class="num">${money(P.available)}</b> of profit in the account, so the most you can ask for is <b class="num">${money(P.maxRequest)}</b>. Profit above the cap stays in the account for a later payout.</p>
        <div class="grid g2">
          <label class="field"><span>Request amount ($)</span><input id="p-req" inputmode="decimal" value="${esc(S.ui.payReq)}" placeholder="${P.maxRequest.toFixed(2)}">${overCap ? `<span class="hint bad">Over the ${money0(P.cap)} cap for payout #${P.payoutNo}.</span>` : overAvail ? '<span class="hint bad">More than the profit in the account.</span>' : ''}</label>
          <label class="field"><span>Method</span><select id="p-method">
            <option value="bank" ${S.ui.payMethod === 'bank' ? 'selected' : ''}>Bank transfer ($19.90 + 2.49%)</option>
            <option value="crypto-low" ${S.ui.payMethod === 'crypto-low' ? 'selected' : ''}>Crypto, most of my orders paid in crypto ($19.90 + 2.49%)</option>
            <option value="crypto" ${S.ui.payMethod === 'crypto' ? 'selected' : ''}>Crypto, otherwise ($19.90 + 30%)</option>
          </select></label>
        </div>
        <div class="preview">
          <div><span class="tiny muted">Your share (${esc(rules.splitPct)}%)</span><b>${money(net.gross)}</b></div>
          <div><span class="tiny muted">Processing fee</span><b class="bad">${money(-net.fee)}</b></div>
          <div><span class="tiny muted">You receive</span><b class="good">${money(net.net)}</b></div>
        </div>
        <p class="small ${buffer < c.L.mtl ? 'bad' : 'muted'}">Balance after payout <b class="num">${money(balAfter)}</b>, leaving <b class="num">${money(buffer)}</b> above your trailing floor (${money(floor)}). The floor doesn't move down after a payout.${buffer < c.L.mtl ? ' That is less than one max trade loss. Request less, or confirm with support how the floor moves after a payout.' : ''}</p>
        ${ro() ? '' : '<div class="row"><button class="btn primary sm" data-action="add-payout">Record a payout</button><button class="btn sm" data-action="add-adjust">Record an adjustment</button></div>'}
        <p class="tiny muted">Request payouts in the Upcomers dashboard, not in Upcomers X. Record it here afterwards so the balance and the next window are right.</p>
      </section>
    </div>
    ${caps.length ? `<section class="card">
      <div class="card-h"><h2>Payout caps for ${money0(c.acc.size)} Vanguard</h2><span class="tiny muted">The cap steps up after each approved payout. After payout ${caps.length}, the account resets to its starting balance and caps lift.</span></div>
      <div class="tw"><table class="t"><thead><tr>${caps.map((_, k) => `<th class="r">#${k + 1}</th>`).join('')}</tr></thead><tbody><tr>${caps.map((v, k) => `<td class="r num ${k === P.payoutNo - 1 ? 'good' : k < P.payoutNo - 1 ? 'muted' : ''}">${k === P.payoutNo - 1 ? '<b>' : ''}${money0(v)}${k === P.payoutNo - 1 ? '</b>' : ''}</td>`).join('')}</tr></tbody></table></div>
    </section>` : ''}
    <section class="card">
      <div class="card-h"><h2>Payouts and adjustments</h2><span class="tiny muted">Payouts lower the balance; adjustments fix differences with the dashboard.</span></div>
      ${payouts.length || adj.length ? `<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Type</th><th>Note</th><th class="r">Amount</th><th></th></tr></thead><tbody>
        ${[...payouts, ...adj].sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts)).map((e) => `<tr><td>${esc(fmtETFull(Date.parse(e.ts)))}</td><td>${e.type === 'payout' ? 'Payout' : 'Adjustment'}</td><td class="small">${esc(e.note || '')}</td><td class="r num ${e.type === 'payout' ? 'bad' : tone(e.amount)}">${e.type === 'payout' ? money(-Math.abs(e.amount)) : smoney(e.amount)}</td><td class="r">${ro() ? '' : `<button class="btn sm ghost" data-del-event="${esc(e.id)}">Delete</button>`}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="small muted">Nothing recorded yet.</p>'}
    </section>`;
  }

  /* ================= STATS ================= */
  function viewStats(c) {
    const s = E.stats(c.trades, c.set, c.acc.rules.resetHourET);
    const L = c.L;
    if (!s.n) return `${bannersHTML(c)}<div class="card empty"><b>Stats appear after your first trade</b><span>Win rate, profit factor, your best setups and hours, what mistakes cost, and a balance chart with your drawdown floor.</span>${ro() ? '' : '<button class="btn" data-action="new-trade">Log a trade</button>'}</div>`;
    const tableOf = (rows, label) => rows.length ? `<div class="tw"><table class="t"><thead><tr><th>${label}</th><th class="r">Trades</th><th class="r">Win %</th><th class="r">Avg</th><th class="r">Net</th></tr></thead><tbody>${rows.map((g) => `<tr><td>${esc(g.key)}</td><td class="r num">${g.n}</td><td class="r num">${g.winRate.toFixed(0)}%</td><td class="r num ${tone(g.avg)}">${smoney(g.avg)}</td><td class="r num ${tone(g.net)}"><b>${smoney(g.net)}</b></td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">Nothing tagged yet.</p>';
    const plan = s.plan;
    const longs = (s.bySide.find((g) => g.key === 'Long') || { n: 0 }).n;
    const longPct = s.n ? Math.round((longs / s.n) * 100) : 0;
    return `
    ${bannersHTML(c)}
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Net P&amp;L</div><div class="v ${tone(s.net)}">${smoney(s.net)}</div><div class="s">${plural(s.n, 'trade')} · fees ${money(s.fees)}</div></div>
      <div class="kpi"><div class="eyebrow">Win rate</div><div class="v">${s.winRate.toFixed(1)}%</div><div class="s">${s.wins}W · ${s.losses}L · ${s.be} flat</div></div>
      <div class="kpi"><div class="eyebrow">Profit factor</div><div class="v">${s.pf === Infinity ? '∞' : s.pf.toFixed(2)}</div><div class="s">won ${money0(s.gp)} / lost ${money0(s.gl)}</div></div>
      <div class="kpi"><div class="eyebrow">Expectancy</div><div class="v ${tone(s.expectancy)}">${smoney(s.expectancy)}</div><div class="s">per trade${s.avgR != null ? ` · avg ${s.avgR > 0 ? '+' : ''}${s.avgR}R` : ''}</div></div>
      <div class="kpi"><div class="eyebrow">Avg win / loss</div><div class="v">${money0(s.avgWin)} / ${money0(s.avgLoss)}</div><div class="s">payoff ${s.avgLoss ? (s.avgWin / s.avgLoss).toFixed(2) : '—'}</div></div>
      <div class="kpi"><div class="eyebrow">Max drawdown</div><div class="v bad">${money(-s.maxDD)}</div><div class="s">worst streak ${plural(s.maxLossStreak, 'loss', 'losses')}</div></div>
    </div>
    <section class="card">
      <div class="card-h"><h2>Balance by session</h2>
        <div class="legend"><span><i style="background:var(--accent)"></i>End-of-day balance</span><span><i style="background:var(--bad)"></i>Trailing floor</span><span><i style="background:var(--muted)"></i>Starting balance</span></div></div>
      ${equityChartHTML(c)}
    </section>
    <section class="card">
      <div class="card-h"><h2>${esc(DF_MONTH.format(new Date((S.ui.month || L.today.slice(0, 7)) + '-15T12:00:00Z')))}</h2>
        <div class="row"><span class="tiny muted"><span class="qual">★</span> qualifying day (${money0(L.qualMin)}+)</span><button class="btn sm" data-month="-1" aria-label="Previous month">‹</button><button class="btn sm" data-month="0">This month</button><button class="btn sm" data-month="1" aria-label="Next month">›</button></div></div>
      ${calendarHTML(c)}
    </section>
    <div class="grid g2">
      <section class="card"><h3 style="margin-bottom:8px">By setup</h3>${tableOf(s.bySetup, 'Setup')}</section>
      <section class="card"><h3 style="margin-bottom:8px">By instrument</h3>${tableOf(s.bySym, 'Instrument')}</section>
      <section class="card"><h3 style="margin-bottom:8px">By hour you entered (ET)</h3>${tableOf(s.byHour, 'Hour')}</section>
      <section class="card"><h3 style="margin-bottom:8px">By weekday</h3>${tableOf(s.byDow, 'Day')}</section>
      <section class="card"><h3 style="margin-bottom:8px">What mistakes cost you</h3>${tableOf(s.byMistake, 'Mistake')}</section>
      <section class="card"><h3 style="margin-bottom:8px">By emotion</h3>${tableOf(s.byEmotion, 'Emotion')}</section>
    </div>
    <section class="card">
      <div class="card-h"><h2>Discipline</h2></div>
      <div class="grid g4">
        <div><div class="eyebrow">Followed the plan</div><div class="num" style="font-size:1.1rem"><b>${plan.followed.n}</b> trades · <span class="${tone(plan.followed.net)}">${smoney(plan.followed.net)}</span></div></div>

  function equityChartHTML(c) {
    const days = c.L.days.filter((d) => d.n > 0 || d.payoutDay || d.isToday);
    const pts = [{ label: 'Start', bal: c.acc.size, floor: E.r2(c.acc.size - c.L.trailAmt) }]
      .concat(days.map((d) => ({ label: fmtDay(d.day), bal: d.endBal, floor: d.isToday ? c.R.floor : d.floor, net: d.net })));
    const W = 760, H = 260, padL = 64, padR = 14, padT = 12, padB = 30;
    const vals = pts.flatMap((p) => [p.bal, p.floor]).concat([c.acc.size]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = Math.max(hi - lo, c.L.trailAmt * 0.6);
    lo -= span * 0.08; hi += span * 0.08;
    const x = (k) => padL + (pts.length === 1 ? (W - padL - padR) / 2 : (k / (pts.length - 1)) * (W - padL - padR));
    const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
    const line = pts.map((p, k) => `${k ? 'L' : 'M'}${x(k).toFixed(1)},${y(p.bal).toFixed(1)}`).join(' ');
    const floorPath = pts.map((p, k) => (k ? `L${x(k).toFixed(1)},${y(pts[k - 1].floor).toFixed(1)} L${x(k).toFixed(1)},${y(p.floor).toFixed(1)}` : `M${x(0).toFixed(1)},${y(p.floor).toFixed(1)}`)).join(' ');
    const grid = Array.from({ length: 5 }, (_, k) => lo + ((hi - lo) * k) / 4).map((v) => `<g><line x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-data)">${money0(v)}</text></g>`).join('');
    const every = Math.max(1, Math.ceil(pts.length / 8));
    const xl = pts.map((p, k) => (k % every === 0 || k === pts.length - 1 ? `<text x="${x(k).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.label)}</text>` : '')).join('');
    const area = `${line} L${x(pts.length - 1).toFixed(1)},${(H - padB).toFixed(1)} L${x(0).toFixed(1)},${(H - padB).toFixed(1)} Z`;
    const last = pts[pts.length - 1];
    S._chart = { pts, x, y, W, H };
    return `<div class="chart" id="eq-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="End-of-day balance with the trailing floor">
      ${grid}
      <line x1="${padL}" x2="${W - padR}" y1="${y(c.acc.size).toFixed(1)}" y2="${y(c.acc.size).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1.2"/>
      <path d="${area}" fill="var(--accent)" opacity=".08"/>
      <path d="${floorPath}" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-dasharray="6 4"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
      ${pts.map((p, k) => `<circle cx="${x(k).toFixed(1)}" cy="${y(p.bal).toFixed(1)}" r="${k === pts.length - 1 ? 4.5 : 2.6}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
      <text x="${Math.min(x(pts.length - 1), W - padR).toFixed(1)}" y="${(y(last.bal) - 10).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--f-data)">${money(last.bal)}</text>
      ${xl}
      <line id="eq-x" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    </svg><div class="tip" id="eq-tip" hidden></div></div>`;
  }
  function wireChart() {
    const box = $('#eq-chart');
    if (!box || !S._chart) return;
    const svg = $('svg', box), tip = $('#eq-tip'), xl = $('#eq-x');
    const { pts, x, y, W, H } = S._chart;
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const px = ((ev.clientX - r.left) / r.width) * W;
      let best = 0;
      pts.forEach((p, k) => { if (Math.abs(x(k) - px) < Math.abs(x(best) - px)) best = k; });
      const p = pts[best];
      xl.setAttribute('x1', x(best)); xl.setAttribute('x2', x(best)); xl.setAttribute('opacity', '1');
      tip.hidden = false;
      tip.style.left = (x(best) / W) * r.width + 'px';
      tip.style.top = (y(p.bal) / H) * r.height + 'px';
      tip.innerHTML = `<b>${esc(p.label)}</b> · ${money(p.bal)}${p.net != null ? ` (${smoney(p.net)})` : ''}<br>floor ${money(p.floor)}`;
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerleave', () => { tip.hidden = true; xl.setAttribute('opacity', '0'); });
  }
  function calendarHTML(c) {
    const ym = S.ui.month || c.L.today.slice(0, 7);
    const byDay = new Map(c.L.days.map((d) => [d.day, d]));
    let start = ym + '-01';
    while (E.weekdayOf(start) !== 1) start = E.addDays(start, -1);
    const cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Week'].map((h) => `<div class="hd">${h}</div>`);
    let d = start;
    for (let w = 0; w < 6; w++) {
      let wk = 0, wkn = 0;
      for (let k = 0; k < 7; k++) {
        if (k < 5) {
          const r = byDay.get(d);
          const has = r && r.n > 0;
          wk += has ? r.net : 0; wkn += has ? r.n : 0;
          const cls = ['c', d.slice(0, 7) !== ym ? 'out' : '', has && r.net > 0 ? 'win' : has && r.net < 0 ? 'loss' : '', d === c.L.today ? 'today' : ''].join(' ');
          cells.push(`<div class="${cls}" title="${esc(fmtLong(d))}"><span class="d"><span>${+d.slice(8)}</span>${r && r.qualifying && r.done ? '<span class="qual" title="Qualifying day">★</span>' : ''}${r && r.payoutDay ? '<span title="Payout">$</span>' : ''}</span>${has ? `<span class="p">${smoney(r.net)}</span><span class="tiny muted">${plural(r.n, 'trade')}</span>` : '<span></span>'}</div>`);
        }
        d = E.addDays(d, 1);
      }
      cells.push(`<div class="c wk"><span class="d"><span>Wk</span></span>${wkn ? `<span class="p ${tone(wk)}">${smoney(wk)}</span><span class="tiny muted">${plural(wkn, 'trade')}</span>` : '<span></span>'}</div>`);
      if (d.slice(0, 7) > ym) break;
    }
    return `<div class="tw"><div class="cal" style="min-width:520px">${cells.join('')}</div></div>`;

  async function uploadImage(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const target = form;
    uploading++; renderShots();
    try {
      const blob = await shrinkImage(file);
      const shot = await Store.saveImage(blob);
      if (form === target && target) { target.shots = (target.shots || []).concat([shot]); }
      else if (target && target.id && S.trades.get(target.id)) {
        const t = S.trades.get(target.id);
        Store.put('trades', Object.assign({}, t, { shots: (t.shots || []).concat([shot]) }));
      } else Store.deleteImage(shot);
    } catch (e) {
      toast(e && e.code === 'quota_exceeded' ? 'Screenshot storage is full.' : 'The screenshot did not save.', 4000);
    } finally {
      uploading--; renderShots();
    }
  }
  function shrinkImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, 1800 / img.naturalWidth);
        if (scale === 1 && file.size < 900000) { URL.revokeObjectURL(url); resolve(file); return; }
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * scale); cv.height = Math.round(img.naturalHeight * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob((b) => resolve(b || file), 'image/jpeg', 0.86);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

    t.id = form.id || uid('t_'); t.acc = form.acc || c.acc.id; t.created = form.created || nowIso();

        S.app.accounts.push(acc); selectAccount(acc.id); Store.saveApp(); toast('Account added. Rename it below.'); break;
      }
      case 'reset-rules': { const acc = activeAccount(); const split = acc.rules.splitPct; acc.rules = Object.assign(E.rulesFor(acc.program, +acc.size), { splitPct: split }); Store.saveApp(); toast('Rules reset to the ' + E.PROGRAMS[acc.program].label + ' defaults'); break; }
      case 'wipe': {
        if (($('#wipe-confirm').value || '').trim() !== 'DELETE') { toast('Type DELETE to confirm.'); break; }
        const acc = activeAccount();
        el.disabled = true;
        let ok = 0, failed = 0;
        for (const coll of ['trades', 'days', 'events']) {
          const ids = [...S[coll].values()].filter((x) => x.acc === acc.id).map((x) => x.id);
          const r = await Store.delMany(coll, ids);
          ok += r.ok; failed += r.failed;
        }
        el.disabled = false;
        toast(failed ? `Deleted ${ok} items; ${failed} could not be deleted yet. Try again.` : `Deleted ${ok} items.`, 5000);
        break;
      }
      case 'coach': runCoach(); break;
      default: break;
    }
  });
  document.addEventListener('keydown', (ev) => {
    const t = ev.target;
    if (ev.key === 'Enter' && t && t.dataset && t.dataset.edit) { const tr = S.trades.get(t.dataset.edit); if (tr) openTradeForm(tr); }
    if (ev.key === 'Enter' && t && (t.id === 'q-net' || t.id === 'q-qty')) { ev.preventDefault(); const b = $('[data-action="quick-add"]'); if (b) b.click(); }
    if (ev.key === 'Enter' && t && t.id === 'd-open') { ev.preventDefault(); t.blur(); }
    if ((ev.key === 'n' || ev.key === 'N') && !ev.ctrlKey && !ev.metaKey && !ev.altKey && !/INPUT|TEXTAREA|SELECT/.test((t && t.tagName) || '') && !$('#dlg').open && S.app && !ro()) { ev.preventDefault(); openTradeForm(null); }
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.calc) { S.ui.calc[t.dataset.calc] = t.value; saveUi(); updateCalc(); return; }
    if (t.closest && t.closest('#tf')) { tfPreview(); return; }
    if (t.id === 'f-search') { S.ui.jSearch = t.value; saveUi(); clearTimeout(S._fs); S._fs = setTimeout(() => { const pos = t.selectionStart; render(); const n = $('#f-search'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }, 250); return; }
    if (t.id === 'd-bal') {
      const c = ctx(); const v = numOrNull(t.value); const act = $('#d-bal-act'); const hint = $('#d-bal-hint');
      if (v == null) { act.hidden = true; hint.textContent = 'Compare with the journal balance.'; return; }
      const diff = E.r2(v - c.L.balance);
      hint.innerHTML = Math.abs(diff) < 0.005 ? '<span class="good">Matches the journal.</span>' : `Journal says ${money(c.L.balance)}. Difference <b class="${tone(diff)}">${smoney(diff)}</b>.`;
      act.hidden = Math.abs(diff) < 0.005 || ro();
      act.innerHTML = `<button class="btn sm" data-action="bal-adjust" data-amt="${diff}">Add a ${smoney(diff)} adjustment so they match</button><span class="tiny muted">Usually commissions you didn't log. Better: log the missing trades.</span>`;
      return;
    }
    if (t.id === 'p-req') { S.ui.payReq = t.value; saveUi(); clearTimeout(S._pr); S._pr = setTimeout(() => { const pos = t.selectionStart; render(); const n = $('#p-req'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }, 350); }
  });
  document.addEventListener('change', async (ev) => {
    const t = ev.target;
    const acc = activeAccount();
    if (t.id === 'acct-switch') { selectAccount(t.value); render(); return; }
    if (t.id === 'c-sym') { if (t.value !== S.ui.calc.sym) S.ui.calc.fee = ''; S.ui.calc.sym = t.value; saveUi(); render(); return; }
    if (t.id === 'q-sym') { S.ui.qSym = t.value; saveUi(); return; }
    if (t.dataset.check != null && t.type === 'checkbox') { const c = ctx(); const checks = Object.assign({}, c.todayDoc.checks || {}); checks[t.dataset.check] = t.checked; saveDay({ checks }); return; }
    if (t.id === 'd-open') { saveOpenPnl(); return; }
    if (t.dataset.dayField) {
      const f = t.dataset.dayField;
      const v = f === 'plan' || f === 'review' ? t.value.slice(0, 5000) : numOrNull(t.value);
      saveDay({ [f]: v });
      return;
    }
    if (t.id === 'f-range') { S.ui.jRange = t.value; S.ui.jLimit = 40; saveUi(); render(); return; }
    if (t.id === 'f-sym') { S.ui.jSym = t.value; saveUi(); render(); return; }
    if (t.id === 'f-setup') { S.ui.jSetup = t.value; saveUi(); render(); return; }
    if (t.id === 'f-result') { S.ui.jResult = t.value; saveUi(); render(); return; }
    if (t.id === 'p-method') { S.ui.payMethod = t.value; saveUi(); render(); return; }
    if (t.id === 'tf-setup') { $('#tf-setup-new').hidden = t.value !== '__new'; if (t.value === '__new') $('#tf-setup-new').focus(); return; }
    if (t.id === 'tf-sym' || t.id === 'tf-roll') { tfPreview(); return; }
    if (t.id === 'tf-file') { const files = [...t.files]; t.value = ''; for (const f of files) await uploadImage(f); return; }
    if (t.id === 'imp-file') { const f = t.files[0]; if (f) { const txt = await f.text(); $('#imp-text').value = txt.slice(0, 200000); impParse(txt); } return; }
    if (t.id === 'imp-fills') { imp.fills = t.checked; impMapUI(); return; }
    if (t.dataset.impField) { if (t.value === '') delete imp.map[t.dataset.impField]; else imp.map[t.dataset.impField] = +t.value; impMapUI(); return; }
    if (t.id === 'restore-file') { const f = t.files[0]; t.value = ''; if (f) await restoreJSON(f); return; }
    // setup fields
    if (!acc || ro()) return;
    const R = acc.rules, set = S.app.settings;
    const nv = numOrNull(t.value);
    const map = {
      'r-trail': () => { R.trailingPct = nv; }, 'r-lock': () => { R.lockOffset = nv; }, 'r-daily': () => { R.dailyPct = nv; },
      'r-mtl': () => { R.maxTradeLossPct = nv; }, 'r-minis': () => { R.maxMinis = nv; R.maxMicros = nv * 10; }, 'r-best': () => { R.bestDayPct = nv; },
      'r-qual': () => { R.qualDayPct = nv; }, 'r-qdays': () => { R.firstPayoutDays = nv; }, 'r-minprof': () => { R.minProfitSincePayoutPct = nv; },
      'r-minpay': () => { R.minPayout = nv; }, 'r-inact': () => { R.inactivityDays = nv; }, 'r-hold': () => { R.minHoldSec = nv; }, 'r-split': () => { R.splitPct = nv; },
      's-per': () => { set.risk.perTrade = nv; }, 's-dstop': () => { set.risk.dailyStop = nv; }, 's-maxt': () => { set.risk.maxTrades = Math.round(nv); },
      's-streak': () => { set.risk.maxLossStreak = Math.round(nv); }, 's-safe': () => { set.risk.safetyPct = clamp(nv, 0, 50); }, 's-slip': () => { set.risk.slipTicks = nv; },
      'fee-micro': () => { set.fees.microSide = nv; }, 'fee-mini': () => { set.fees.miniSide = nv; },
    };
    if (map[t.id]) {
      if (nv == null || nv < 0) { toast('Enter a number of 0 or more.'); render(); return; }
      map[t.id](); Store.saveApp(); return;
    }
    if (t.id === 'r-tmode') { R.trailingMode = ['eod', 'rt', 'both'].includes(t.value) ? t.value : 'both'; Store.saveApp(); return; }
    if (t.id === 'a-name') { acc.name = t.value.trim().slice(0, 60) || acc.name; Store.saveApp(); return; }
    if (t.id === 'a-pid') { acc.platformId = t.value.trim().slice(0, 30); Store.saveApp(); return; }
    if (t.id === 'a-start') { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) { acc.startDate = t.value; Store.saveApp(); } return; }
    if (t.id === 'a-size') { const split = R.splitPct; acc.size = +t.value; acc.rules = Object.assign(E.rulesFor(acc.program, acc.size), { splitPct: split }); Store.saveApp(); toast('Size changed; rules reset for ' + money0(acc.size)); return; }
    if (t.id === 'a-program') { acc.program = E.PROGRAMS[t.value] ? t.value : 'vanguard'; acc.rules = E.rulesFor(acc.program, +acc.size); Store.saveApp(); toast('Rules set to ' + E.PROGRAMS[acc.program].label); return; }
    if (t.id === 's-favs') {
      const list = t.value.split(/[,\s]+/).map((x) => x.trim().toUpperCase()).filter((x) => E.inst(x));
      if (list.length) { set.favorites = [...new Set(list)].slice(0, 10); Store.saveApp(); } else toast('Use symbols like MES, MNQ, MGC.');
    }
  });
  document.addEventListener('paste', (ev) => {
    if (!form || !$('#dlg').open || !$('#tf')) return;
    const items = [...((ev.clipboardData && ev.clipboardData.items) || [])].filter((x) => x.type && x.type.startsWith('image/'));
    if (!items.length) return;
    ev.preventDefault();
    items.forEach((x) => uploadImage(x.getAsFile()));
  });
  $('#dlg').addEventListener('close', () => { form = null; if (renderPending === true) flushRender(); });

  /* ================= boot ================= */
  const VIEWS = { today: viewToday, size: viewSize, journal: viewJournal, payout: viewPayout, stats: viewStats, rules: viewRules, setup: viewSetup };
  let lastDay = null;
  setInterval(() => {
    tickClock();
    const c = S.app && activeAccount() ? ctx() : null;
    if (c && lastDay && c.L.today !== lastDay) { memo = null; scheduleRender(); }
    if (c) lastDay = c.L.today;
  }, 30000);
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#', '');
    if (VIEWS[h] && h !== S.ui.tab) setTab(h);
  });
  render();
  Store.init().then(() => { if (Store.mode === 'local' && S.app) askPersist(); });
})();

</script>

</body></html>
