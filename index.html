<title>Vanguard 25K Desk</title>
<style>
/* Layout: a trading desk. Sticky status strip with the live risk verdict, a tab rail,
   then one working column (max 1120px). Big Shoulders (Chicago signage, home of CME) for the few big numbers. */
:root {
  --bg: #edf0f4; --surface: #ffffff; --sunk: #e3e8ee; --ink: #111923; --muted: #586474; --line: #d2d9e2;
  --accent: #2648d1; --accent-ink: #ffffff; --accent-soft: #e2e8ff;
  --good: #0a7a51; --good-soft: #daf2e7; --warn: #9a5800; --warn-soft: #fcecd4; --bad: #c0242b; --bad-soft: #fadfe0;
  --shadow: 0 1px 2px rgba(17,25,35,.06), 0 4px 16px rgba(17,25,35,.06);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-data: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1117; --surface: #141b24; --sunk: #0a0e13; --ink: #e6ebf1; --muted: #93a0b1; --line: #253041;
  --accent: #8ea7ff; --accent-ink: #0c1117; --accent-soft: #1a2447;
  --good: #3fcb8e; --good-soft: #0f2a1f; --warn: #f1aa4b; --warn-soft: #2d2110; --bad: #ff6d72; --bad-soft: #3a1518;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #141b24; --sunk: #0a0e13; --ink: #e6ebf1; --muted: #93a0b1; --line: #253041;
  --accent: #8ea7ff; --accent-ink: #0c1117; --accent-soft: #1a2447;
  --good: #3fcb8e; --good-soft: #0f2a1f; --warn: #f1aa4b; --warn-soft: #2d2110; --bad: #ff6d72; --bad-soft: #3a1518;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; }
h3 { font-size: .98rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tab-n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 650; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- top strip ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font: 800 1.45rem/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
.brand select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 6px; font-size: .82rem; max-width: 46vw; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 650; font-size: .82rem; white-space: nowrap; border: 1px solid transparent; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.pill.clear { background: var(--good-soft); color: var(--good); }
.pill.caution { background: var(--warn-soft); color: var(--warn); }
.pill.stop { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--sunk); color: var(--muted); }
.clock { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.clock b { color: var(--ink); font-family: var(--f-data); font-weight: 600; }
.save { font-size: .76rem; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.save i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.save.cloud i { background: var(--good); } .save.local i { background: var(--warn); } .save.err i { background: var(--bad); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 8px 12px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-size: .92rem; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

main { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .split { grid-template-columns: minmax(0, 1fr); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.field .hint { font-size: .74rem; color: var(--muted); }
input[type="number"] { font-family: var(--f-data); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--sunk); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; cursor: pointer; color: var(--muted); font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg.long-short button[data-v="long"][aria-pressed="true"] { color: var(--good); }
.seg.long-short button[data-v="short"][aria-pressed="true"] { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .84rem; cursor: pointer; font-weight: 550; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip.sym { font-family: var(--f-data); font-weight: 600; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; }
.badge.long { background: var(--good-soft); color: var(--good); }
.badge.short { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.plain { background: var(--sunk); color: var(--muted); }

/* ---------- today hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; }
@media (max-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.room { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.room .big { font: 800 clamp(3rem, 9vw, 4.6rem)/.95 var(--f-display); letter-spacing: .005em; font-variant-numeric: tabular-nums; }
.room .big.stop { color: var(--bad); } .room .big.caution { color: var(--warn); }
.verdict { padding: 10px 12px; border-radius: 8px; font-weight: 550; font-size: .92rem; }
.verdict.clear { background: var(--good-soft); color: var(--good); }
.verdict.caution { background: var(--warn-soft); color: var(--warn); }
.verdict.stop { background: var(--bad-soft); color: var(--bad); }
.verdict.info { background: var(--sunk); color: var(--muted); }
.verdict ul { margin: 4px 0 0; padding-left: 18px; }
.meters { display: flex; flex-direction: column; gap: 14px; }
.meter-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .88rem; flex-wrap: wrap; }
.meter-h b { font-weight: 650; }
.bar { height: 10px; background: var(--sunk); border-radius: 6px; overflow: hidden; position: relative; margin-top: 5px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 6px; transition: width .3s; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); } .bar.acc > i { background: var(--accent); }
.bar .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .5; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .v { font: 650 clamp(1.05rem, 4.6vw, 1.25rem)/1.2 var(--f-data); font-variant-numeric: tabular-nums; margin-top: 2px; overflow-wrap: anywhere; }
.kpi .s { font-size: .76rem; color: var(--muted); }

/* ---------- calculator ---------- */
.calc-out { display: flex; flex-direction: column; gap: 14px; }
.answer { border-radius: var(--r); padding: 16px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.answer.zero { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.answer .qty { font: 800 clamp(2.6rem, 8vw, 3.8rem)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.answer .qty small { font-size: .45em; font-weight: 600; letter-spacing: .02em; margin-left: 6px; }
.caps { display: flex; flex-direction: column; gap: 8px; }
.cap { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }
.cap.binding { border-color: var(--accent); background: var(--accent-soft); }
.cap .bar { grid-column: 1 / -1; height: 6px; margin: 0; }
.cap .n { font: 650 1rem var(--f-data); min-width: 3ch; text-align: right; }
table.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.t th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr.hl td { background: var(--accent-soft); }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---------- journal ---------- */
.quick { display: grid; grid-template-columns: 1.1fr .9fr .6fr 1fr auto; gap: 8px; align-items: end; }
@media (max-width: 720px) { .quick { grid-template-columns: 1fr 1fr; } .quick .btn { grid-column: 1 / -1; } }
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 2px 6px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.day-h b { font-weight: 700; }
.trade { display: grid; grid-template-columns: 74px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trade:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
.trade .sym { font: 650 .95rem var(--f-data); }
.trade .mid { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.trade .mid .px { font-family: var(--f-data); font-size: .84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trade .mid .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.trade .pnl { text-align: right; font: 650 1rem var(--f-data); white-space: nowrap; }
.trade .pnl small { display: block; font-size: .74rem; color: var(--muted); font-weight: 500; }
@media (max-width: 560px) { .trade { grid-template-columns: 60px minmax(0, 1fr) auto; } .trade .tm { display: none; } }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: .85rem; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--ink); font-size: 1.02rem; }
.shots { display: flex; gap: 8px; flex-wrap: wrap; }
.shots img { width: 120px; height: 76px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, .9fr); gap: 6px; }
.cal .hd { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; padding: 0 4px; }
.cal .c { min-height: 66px; border-radius: 8px; background: var(--sunk); padding: 6px 7px; display: flex; flex-direction: column; justify-content: space-between; font-size: .78rem; min-width: 0; }
.cal .c .d { color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.cal .c .p { font: 650 .86rem var(--f-data); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .c.win { background: var(--good-soft); } .cal .c.win .p { color: var(--good); }
.cal .c.loss { background: var(--bad-soft); } .cal .c.loss .p { color: var(--bad); }
.cal .c.out { opacity: .35; }
.cal .c.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal .c.wk { background: transparent; border: 1px dashed var(--line); }
.qual { color: var(--accent); font-weight: 800; }

/* ---------- chart ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: .78rem; white-space: nowrap; transform: translate(-50%, -110%); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- rules ---------- */
.rule { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 6px 18px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule .k { font-weight: 650; }
.rule .val { font: 650 1rem var(--f-data); }
.rule .why { color: var(--muted); font-size: .88rem; max-width: 70ch; }
.rule .src { font-size: .76rem; }
@media (max-width: 640px) { .rule { grid-template-columns: minmax(0, 1fr); } }
.req { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.tickmark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: var(--sunk); color: var(--muted); }
.tickmark.ok { background: var(--good); color: var(--surface); }
.tickmark.no { background: var(--warn-soft); color: var(--warn); }

/* ---------- dialog, toast, fab ---------- */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(8,12,18,.55); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; gap: 10px; }
.dlg-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.dlg-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); flex-wrap: wrap; }
.preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.preview div { display: flex; flex-direction: column; }
.preview b { font: 650 1rem var(--f-data); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-weight: 550; z-index: 60; max-width: calc(100vw - 32px); box-shadow: var(--shadow); font-size: .9rem; }
/* shown as a popover so it sits above an open dialog */
.toast[popover] { inset: auto; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); margin: 0; border: 0; overflow: visible; }
@media (max-width: 560px) {
  .top-in { padding-top: 8px; gap: 4px; }
  .top-row { row-gap: 4px; }
  .brand b { font-size: 1.25rem; }
  .save span { display: none; }
  .clock .muted { display: none; }
  .tabs { mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .tabs button { padding: 7px 10px 9px; }
}
.fab { position: fixed; right: max(16px, calc((100vw - 1120px) / 2 + 16px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 13px 18px; border-radius: 999px; box-shadow: 0 8px 24px rgba(38,72,209,.35); cursor: pointer; font-size: .95rem; }
.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: .9rem; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }

<script>
/* Vanguard 25K Desk: pure logic, no DOM.
   Loaded by index.html (window.Engine) and by the node tests (require). */
(function (root, factory) {
  const E = factory();
  if (typeof module === 'object' && module.exports) module.exports = E;
  else root.Engine = E;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DAY = 864e5;
  const r2 = (x) => Math.round((x + Math.sign(x) * 1e-9) * 100) / 100;
  const isNum = (x) => x !== null && x !== '' && x !== undefined && Number.isFinite(+x);
  const num = (x, d = 0) => (isNum(x) ? +x : d);

  /* ---------------------------------------------------------------
     Instruments: the 50 Upcomers futures markets (CME Group specs).
     tick = minimum price move, tv = dollars per tick per contract,
     micro = counts as 1/10 of a mini toward the contract limit.
     --------------------------------------------------------------- */
  const RAW = [
    // sym, name, group, tick, tickValue, micro
    ['MES', 'Micro E-mini S&P 500', 'Index', 0.25, 1.25, true],
    ['MNQ', 'Micro E-mini Nasdaq-100', 'Index', 0.25, 0.5, true],
    ['MYM', 'Micro E-mini Dow', 'Index', 1, 0.5, true],
    ['M2K', 'Micro E-mini Russell 2000', 'Index', 0.1, 0.5, true],
    ['ES', 'E-mini S&P 500', 'Index', 0.25, 12.5, false],
    ['NQ', 'E-mini Nasdaq-100', 'Index', 0.25, 5, false],
    ['YM', 'E-mini Dow ($5)', 'Index', 1, 5, false],
    ['RTY', 'E-mini Russell 2000', 'Index', 0.1, 5, false],
    ['MGC', 'Micro Gold', 'Metals', 0.1, 1, true],
    ['SIL', 'Micro Silver (1,000 oz)', 'Metals', 0.005, 5, true],
    ['MHG', 'Micro Copper', 'Metals', 0.0005, 1.25, true],
    ['GC', 'Gold', 'Metals', 0.1, 10, false],
    ['SI', 'Silver', 'Metals', 0.005, 25, false],
    ['HG', 'Copper', 'Metals', 0.0005, 12.5, false],
    ['PL', 'Platinum', 'Metals', 0.1, 5, false],
    ['PA', 'Palladium', 'Metals', 0.5, 50, false],
    ['MCL', 'Micro WTI Crude Oil', 'Energy', 0.01, 1, true],
    ['CL', 'WTI Crude Oil', 'Energy', 0.01, 10, false],
    ['QM', 'E-mini Crude Oil', 'Energy', 0.025, 12.5, false],
    ['NG', 'Henry Hub Natural Gas', 'Energy', 0.001, 10, false],
    ['QG', 'E-mini Natural Gas', 'Energy', 0.005, 12.5, false],
    ['HO', 'NY Harbor ULSD', 'Energy', 0.0001, 4.2, false],
    ['RB', 'RBOB Gasoline', 'Energy', 0.0001, 4.2, false],
    ['M6E', 'Micro EUR/USD', 'FX', 0.0001, 1.25, true],
    ['M6A', 'Micro AUD/USD', 'FX', 0.0001, 1, true],
    ['M6B', 'Micro GBP/USD', 'FX', 0.0001, 0.625, true],
    ['6E', 'Euro FX', 'FX', 0.00005, 6.25, false],
    ['6B', 'British Pound', 'FX', 0.0001, 6.25, false],
    ['6J', 'Japanese Yen', 'FX', 0.0000005, 6.25, false],
    ['6A', 'Australian Dollar', 'FX', 0.00005, 5, false],
    ['6C', 'Canadian Dollar', 'FX', 0.00005, 5, false],
    ['6S', 'Swiss Franc', 'FX', 0.00005, 6.25, false],
    ['6N', 'New Zealand Dollar', 'FX', 0.00005, 5, false],
    ['ZB', 'U.S. T-Bond (32nds)', 'Rates', 0.03125, 31.25, false],
    ['UB', 'Ultra T-Bond (32nds)', 'Rates', 0.03125, 31.25, false],
    ['ZN', '10-Year T-Note (64ths)', 'Rates', 0.015625, 15.625, false],
    ['ZF', '5-Year T-Note (128ths)', 'Rates', 0.0078125, 7.8125, false],
    ['ZT', '2-Year T-Note (256ths)', 'Rates', 0.00390625, 7.8125, false],
    ['ZC', 'Corn (cents/bu)', 'Grains', 0.25, 12.5, false],
    ['ZS', 'Soybeans (cents/bu)', 'Grains', 0.25, 12.5, false],
    ['ZW', 'Chicago Wheat (cents/bu)', 'Grains', 0.25, 12.5, false],
    ['ZL', 'Soybean Oil (cents/lb)', 'Grains', 0.01, 6, false],
    ['ZM', 'Soybean Meal ($/ton)', 'Grains', 0.1, 10, false],
    ['HE', 'Lean Hogs (cents/lb)', 'Livestock', 0.025, 10, false],
    ['LE', 'Live Cattle (cents/lb)', 'Livestock', 0.025, 10, false],
    ['GF', 'Feeder Cattle (cents/lb)', 'Livestock', 0.025, 12.5, false],
    ['MBT', 'Micro Bitcoin (0.1 BTC)', 'Crypto', 5, 0.5, true],
    ['MET', 'Micro Ether (0.1 ETH)', 'Crypto', 0.5, 0.05, true],
    ['BTC', 'Bitcoin (5 BTC)', 'Crypto', 5, 25, false],
    ['ETH', 'Ether (50 ETH)', 'Crypto', 0.5, 25, false],
  ];
  function decimalsOf(x) {
    const s = String(x);
    if (s.includes('e-')) return +s.split('e-')[1];
    return s.includes('.') ? s.split('.')[1].length : 0;
  }
  // weight = mini-equivalents per contract for the contract limit (10 micros = 1 mini;
  // SIL is 1/5 of SI, so it counts 0.2 to stay on the safe side)
  const INSTRUMENTS = RAW.map(([sym, name, group, tick, tv, micro]) => ({
    sym, name, group, tick, tv, micro, pv: tv / tick, dec: Math.min(decimalsOf(tick), 7),
    weight: sym === 'SIL' ? 0.2 : micro ? 0.1 : 1,
  }));
  const BY_SYM = Object.fromEntries(INSTRUMENTS.map((i) => [i.sym, i]));
  function inst(sym) { return BY_SYM[String(sym || '').toUpperCase().trim()] || null; }
  /** Map a platform symbol like "MESZ6", "MNQ 12-26", "/MGCZ26" or "CME_MINI:MES1!" to a root. */
  function rootSymbol(s) {
    let x = String(s || '').toUpperCase().replace(/^.*:/, '').replace(/^\//, '').replace(/[!\s].*$/, '').trim();
    if (BY_SYM[x]) return x;
    const m = x.match(/^([A-Z0-9]{1,3}?[A-Z]+?)([FGHJKMNQUVXZ]\d{1,2})$/);
    if (m && BY_SYM[m[1]]) return m[1];
    for (let n = 3; n >= 2; n--) if (BY_SYM[x.slice(0, n)]) return x.slice(0, n);
    return x;
  }

  /* ---------------------------------------------------------------
     Time: the futures trading day runs 6:00 PM ET to 5:00 PM ET and
     Upcomers resets the daily drawdown at 5:00 PM ET.
     --------------------------------------------------------------- */
  const ET_FMT = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hourCycle: 'h23', weekday: 'short',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  function etParts(ms) {
    const o = {};
    for (const p of ET_FMT.formatToParts(new Date(ms))) o[p.type] = p.value;
    return { y: +o.year, mo: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second, wd: o.weekday };
  }
  const isoOf = (ms) => new Date(ms).toISOString().slice(0, 10);
  const dayMs = (iso) => Date.parse(iso + 'T00:00:00Z');
  const addDays = (iso, n) => isoOf(dayMs(iso) + n * DAY);
  const weekdayOf = (iso) => new Date(dayMs(iso)).getUTCDay();
  /** The trading session before `iso` (skips weekends). */
  function prevTradingDay(iso) {
    let d = addDays(iso, -1);
    while (weekdayOf(d) === 0 || weekdayOf(d) === 6) d = addDays(d, -1);
    return d;
  }
  /** ET wall-clock time -> epoch ms (handles DST). */
  function etToUtc(y, mo, d, h, mi) {
    const want = Date.UTC(y, mo - 1, d, h, mi);
    let guess = want + 5 * 36e5;
    for (let i = 0; i < 3; i++) {
      const p = etParts(guess);
      const diff = want - Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi);
      if (!diff) break;
      guess += diff;
    }
    return guess;
  }
  /** Trading day (YYYY-MM-DD) a moment belongs to: after 5 PM ET it is the next weekday's session. */
  function tradingDay(ms, resetHour = 17) {
    const p = etParts(ms);
    let d = Date.UTC(p.y, p.mo - 1, p.d);
    if (p.h >= resetHour) d += DAY;
    const wd = new Date(d).getUTCDay();
    if (wd === 6) d += 2 * DAY;
    else if (wd === 0) d += DAY;
    return isoOf(d);
  }
  /** The next 5 PM ET reset on a weekday after `ms`. */
  function nextReset(ms, resetHour = 17) {
    const p = etParts(ms);
    let iso = isoOf(Date.UTC(p.y, p.mo - 1, p.d));
    for (let i = 0; i < 8; i++) {
      const wd = weekdayOf(iso);
      if (wd >= 1 && wd <= 5) {
        const [y, mo, d] = iso.split('-').map(Number);
        const t = etToUtc(y, mo, d, resetHour, 0);
        if (t > ms) return t;
      }
      iso = addDays(iso, 1);
    }
    return ms + DAY;
  }
  /** CME Globex status for equity/most products: closed Fri 5 PM to Sun 6 PM ET and 5-6 PM ET daily. */
  function marketStatus(ms) {
    const p = etParts(ms);
    const wd = new Date(Date.UTC(p.y, p.mo - 1, p.d)).getUTCDay();
    const mins = p.h * 60 + p.mi;
    if (wd === 6 || (wd === 5 && mins >= 17 * 60) || (wd === 0 && mins < 18 * 60)) return 'weekend';
    if (mins >= 17 * 60 && mins < 18 * 60) return 'break';
    return 'open';
  }

  /* ---------------------------------------------------------------
     Program presets. Values come from the official Upcomers help
     center (see RULE_SOURCES in app.js); everything stays editable.
     --------------------------------------------------------------- */
  // Vanguard per-payout caps (help article 15750156), payouts 1-7; after payout 7 caps lift.
  const VANGUARD_CAPS = {
    25000: [500, 1000, 1500, 1500, 1500, 1500, 1500],
    50000: [1000, 2000, 3000, 3000, 3000, 3000, 3000],
    100000: [1600, 3200, 4800, 5000, 6000, 6000, 6000],
    150000: [1900, 3800, 5000, 5000, 9000, 9000, 9000],
    200000: [2300, 4600, 5000, 5000, 11500, 12000, 12000],
    250000: [2600, 5000, 5000, 5000, 13000, 15000, 15000],
    300000: [3100, 5000, 5000, 5000, 15500, 18000, 18000],
  };
  function vanguardRules(size) {
    const minis = { 25000: 3, 50000: 5, 100000: 10, 150000: 15, 200000: 20, 250000: 25, 300000: 30 }[size] || Math.ceil(size / 10000);
    return {
      // 'both' = the stricter of the EOD reading (lock at start + $100) and the
      // older real-time reading (trails the intraday peak, locks at start).
      trailingPct: 3, trailingMode: 'both', lockOffset: 100, rtLockOffset: 0,
      dailyPct: 2, maxTradeLossPct: 1.5,
      maxMinis: minis, maxMicros: minis * 10,
      bestDayPct: 20, qualDayPct: 0.5, firstPayoutDays: 5,
      // articles: $100 share; the dashboard shows $250, so use the stricter until support confirms
      minProfitSincePayoutPct: 1, minPayout: 250, splitPct: 100,
      payoutFeeFixed: 19.9, payoutFeePct: 2.49,
      payoutCaps: (VANGUARD_CAPS[size] || []).slice(),
      inactivityDays: 14, resetHourET: 17, minHoldSec: 120,
    };
  }
  // Thunderbolt Classic funded: 4% real-time trailing that locks at the starting balance,
  // 2% daily when funded, no qualifying-day gate. Payout caps are not loaded: check the dashboard.
  function thunderboltRules(size) {
    return Object.assign(vanguardRules(size), {
      trailingPct: 4, trailingMode: 'rt', lockOffset: 0, rtLockOffset: 0,
      qualDayPct: 0, firstPayoutDays: 0, minPayout: 100, splitPct: 90, payoutCaps: [],
    });
  }
  const PROGRAMS = {
    vanguard: { label: 'Vanguard (instant funding)', rules: vanguardRules },
    thunderbolt: { label: 'Thunderbolt Classic (funded)', rules: thunderboltRules },
  };
  function rulesFor(program, size) { return (PROGRAMS[program] || PROGRAMS.vanguard).rules(size); }

  /* ---------------------------------------------------------------
     Per-trade math
     --------------------------------------------------------------- */
  function feePerSide(settings, sym) {
    const f = (settings && settings.fees) || {};
    if (f.overrides && isNum(f.overrides[sym])) return +f.overrides[sym];
    const i = inst(sym);
    return i && i.micro ? num(f.microSide, 0.62) : num(f.miniSide, 2.25);
  }
  /** Everything we can derive about one closed trade. */
  function tradeCalc(t, settings) {
    const i = inst(t.sym);
    const dir = t.side === 'short' ? -1 : 1;
    const qty = Math.abs(num(t.qty, 0));
    let ticks = null, gross = null;
    if (i && isNum(t.entry) && isNum(t.exit)) {
      ticks = Math.round(((t.exit - t.entry) * dir / i.tick) * 1000) / 1000;
      gross = r2(ticks * i.tv * qty);
    }
    const fees = isNum(t.fees) ? r2(+t.fees) : r2(qty * 2 * feePerSide(settings, t.sym));
    let net;
    if (isNum(t.netManual)) { net = r2(+t.netManual); if (gross == null) gross = r2(net + fees); }
    else net = gross == null ? 0 : r2(gross - fees);
    let risk = null, stopTicks = null;
    if (i && isNum(t.entry) && isNum(t.stop) && +t.stop !== +t.entry) {
      stopTicks = Math.round((Math.abs(t.entry - t.stop) / i.tick) * 1000) / 1000;
      risk = r2(stopTicks * i.tv * qty);
    } else if (isNum(t.riskManual) && +t.riskManual > 0) risk = r2(+t.riskManual);
    const R = risk ? Math.round((net / risk) * 100) / 100 : null;
    const openMs = t.openTs ? Date.parse(t.openTs) : null;
    const closeMs = t.closeTs ? Date.parse(t.closeTs) : openMs;
    // a trade still open (no close time) has no hold time yet
    const holdSec = openMs && t.closeTs && closeMs >= openMs ? Math.round((closeMs - openMs) / 1000) : null;
    let reward = null;
    if (i && isNum(t.entry) && isNum(t.target)) reward = r2(Math.abs(t.target - t.entry) / i.tick * i.tv * qty);
    return { inst: i, qty, dir, ticks, gross, fees, net, risk, stopTicks, R, holdSec, reward, closeMs, openMs };
  }

  /* ---------------------------------------------------------------
     Position sizing: the smallest of every limit wins.
     --------------------------------------------------------------- */
  /**
   * p = { sym, side, mode:'price'|'ticks', entry, stop, target, stopTicks, targetTicks,
   *       slipTicks, feeSide, budget, safetyPct, maxTradeLoss, dailyRoom, trailRoom,
   *       openRisk, sameRisk, openMiniEq, maxMinis, maxMicros, todayNet, bestDay, profitWindow, bestDayPct,
   *       extraCaps: [{ key, label, dollars, rule }] }
   * openRisk: dollars ALL open positions lose from here if their stops hit (comes off daily and trailing room).
   * sameRisk: dollars already-open same-direction positions in this market or its mini/micro twin lose
   *           from their entries if their stops hit (comes off the max trade loss; also inside openRisk).
   */
  function sizeTrade(p) {
    const i = inst(p.sym);
    const out = { ok: false, errors: [], warnings: [], caps: [], qty: 0 };
    if (!i) { out.errors.push('Pick an instrument.'); return out; }
    const tick = i.tick, tv = i.tv;
    let stopTicks, targetTicks = null;
    if (p.mode === 'ticks') {
      stopTicks = num(p.stopTicks, 0);
      if (isNum(p.targetTicks) && +p.targetTicks > 0) targetTicks = +p.targetTicks;
    } else {
      if (!isNum(p.entry) || !isNum(p.stop)) { out.errors.push('Enter an entry and a stop price.'); return out; }
      const e = +p.entry, s = +p.stop;
      if (p.side === 'long' && s >= e) out.errors.push('For a long, the stop must be below the entry.');
      if (p.side === 'short' && s <= e) out.errors.push('For a short, the stop must be above the entry.');
      stopTicks = Math.abs(e - s) / tick;
      if (isNum(p.target)) {
        const t = +p.target;
        if ((p.side === 'long' && t <= e) || (p.side === 'short' && t >= e)) out.warnings.push('The target is on the wrong side of the entry.');
        else targetTicks = Math.abs(t - e) / tick;
      }
    }
    // a stop between ticks gets filled at the next tick
    stopTicks = Math.ceil(stopTicks - 1e-6);
    if (stopTicks <= 0) out.errors.push('The stop distance must be at least 1 tick.');
    if (out.errors.length) return out;
    if (targetTicks != null) targetTicks = Math.floor(targetTicks + 1e-6);

    const slip = Math.max(0, num(p.slipTicks, 0));
    const fee = Math.max(0, num(p.feeSide, 0));
    const perC = r2((stopTicks + slip) * tv + 2 * fee);
    const safety = Math.min(0.9, Math.max(0, num(p.safetyPct, 0) / 100));
    const keep = 1 - safety;
    const openRisk = Math.max(0, num(p.openRisk, 0));
    // same instrument (or its mini/micro twin) + same direction = one trade for the max trade loss
    const sameRisk = Math.max(0, num(p.sameRisk, 0));
    const fit = (dollars) => (dollars <= 0 ? 0 : Math.floor(dollars / perC + 1e-9));
    // hard limits breach on touch, so a loss exactly equal to the room does not fit
    const fitStrict = (dollars) => (dollars <= 0 ? 0 : Math.max(0, Math.ceil(dollars / perC - 1e-9) - 1));

    const mtl = num(p.maxTradeLoss, 0);
    const mtlRoom = mtl - sameRisk;
    const daily = num(p.dailyRoom, Infinity) - openRisk;
    const trail = num(p.trailRoom, Infinity) - openRisk;
    const budget = num(p.budget, Infinity);
    const used = Math.max(0, num(p.openMiniEq, 0));
    const limitN = Math.max(0, Math.floor((num(p.maxMinis, 3) - used) / i.weight + 1e-9));

    out.caps = [
      { key: 'mtl', label: 'Max trade loss', rule: true, dollars: r2(mtlRoom * keep), n: fitStrict(mtlRoom * keep), hard: true },
      { key: 'daily', label: 'Daily drawdown room', rule: true, dollars: r2(daily * keep), n: fitStrict(daily * keep), hard: true },
      { key: 'trail', label: 'Trailing drawdown room', rule: true, dollars: r2(trail * keep), n: fitStrict(trail * keep), hard: true },
      { key: 'budget', label: 'Your risk per trade', rule: false, dollars: r2(budget), n: fit(budget) },
      { key: 'limit', label: 'Contract limit', rule: true, dollars: null, n: limitN, hard: true },
    ].filter((c) => c.key === 'limit' || Number.isFinite(c.dollars));
    for (const x of p.extraCaps || []) {
      if (Number.isFinite(+x.dollars)) out.caps.push({ key: x.key, label: x.label, rule: !!x.rule, dollars: r2(+x.dollars), n: fit(+x.dollars) });
    }
    const qty = Math.max(0, Math.min(...out.caps.map((c) => c.n)));
    const binding = out.caps.filter((c) => c.n === qty).map((c) => c.key);
    out.caps.forEach((c) => { c.binding = binding.includes(c.key); });

    const stopRisk = r2(stopTicks * tv * qty);
    const worst = r2(perC * qty);
    out.ok = true;
    out.qty = qty;
    out.inst = i;
    out.stopTicks = stopTicks;
    out.stopPoints = Math.round(stopTicks * tick * 1e7) / 1e7;
    out.perContract = perC;
    out.stopRisk = stopRisk;
    out.worstCase = worst;
    out.binding = binding;
    out.sameRisk = sameRisk;
    out.pctOfMtl = mtl ? Math.round((worst / mtl) * 1000) / 10 : null;
    if (targetTicks != null) {
      // per contract, in dollars, with the same costs as perContract
      const rewPerC = targetTicks * tv - 2 * fee;
      out.targetTicks = targetTicks;
      out.reward = r2(targetTicks * tv * qty - 2 * fee * qty);
      out.rr = r2(rewPerC / perC);
      out.breakevenWinRate = rewPerC > 0 ? Math.round((perC / (perC + rewPerC)) * 1000) / 10 : 100;
      if (rewPerC <= 0) out.warnings.push('The target does not cover fees and slippage.');
    }
    if (qty === 0) {
      const tightest = out.caps.filter((c) => c.binding)[0];
      out.warnings.push(tightest && tightest.key === 'limit'
        ? 'You are already at the contract limit.'
        : tightest && tightest.dollars != null && tightest.dollars <= 0
          ? `"${tightest.label}" has no room left, so no size fits.`
          : `Even 1 contract risks $${perC.toFixed(2)} here, which does not fit under "${tightest ? tightest.label : 'the limit'}"${tightest && tightest.dollars != null ? ` ($${tightest.dollars.toFixed(2)})` : ''}. Tighten the stop or use the micro.`);
    } else if (mtl > 0 && worst + sameRisk >= 0.9 * mtl - 1e-9) {
      // rulebook: warn near the cap (the cap itself is enforced strictly above)
      out.warnings.push(`This puts ${Math.round(((worst + sameRisk) / mtl) * 1000) / 10}% of the $${mtl.toFixed(0)} max trade loss at risk${sameRisk > 0 ? ' together with your open position' : ''}. One bad fill could breach it.`);
    }
    // the stop ladder: widest stop per contract count that stays strictly under the tightest dollar cap
    const priced = out.caps.filter((c) => c.dollars != null && Number.isFinite(c.dollars));
    const tight = priced.reduce((m, c) => (!m || c.dollars < m.dollars ? c : m), null);
    out.ladderBudget = tight ? tight.dollars : 0;
    out.ladderBindingLabel = tight ? tight.label : null;
    out.ladder = [];
    const hasPx = p.mode !== 'ticks' && isNum(p.entry);
    // the sizer charges the cent-rounded perContract, so a row must also fit with that (M6B, ZF, ZT ticks have sub-cent values)
    const rowCents = (t, n) => Math.round(r2((t + slip) * tv + 2 * fee) * n * 100);
    const budgetCents = Math.round(out.ladderBudget * 100);
    for (let n = 1; n <= Math.min(limitN, 10); n++) {
      let t = Math.ceil((out.ladderBudget / n - 2 * fee) / tv - slip - 1e-9) - 1;
      while (t >= 1 && rowCents(t, n) >= budgetCents) t--;
      if (t < 1) break;
      let ticks = t, points = Math.round(t * tick * 1e9) / 1e9, price = null;
      if (hasPx) {
        // snap to the tick grid toward the entry, so an off-grid entry never widens the stop past t ticks
        const e = +p.entry;
        const raw = p.side === 'short' ? Math.floor((e + t * tick) / tick + 1e-9) * tick : Math.ceil((e - t * tick) / tick - 1e-9) * tick;
        price = Math.round(raw * 1e9) / 1e9;
        const dist = Math.abs(e - price);
        ticks = Math.ceil(dist / tick - 1e-6); // what the sizer charges for this stop
        points = Math.round(dist * 1e9) / 1e9;
        if (ticks < 1) break;
      }
      // worst = what the sizer shows as worstCase for n contracts at this stop
      const row = { n, ticks, points, dollars: r2(ticks * tv * n), worst: r2(r2((ticks + slip) * tv + 2 * fee) * n) };
      if (price != null) row.price = price;
      out.ladder.push(row);
    }
    // best-day (consistency) effect if the target is hit
    if (out.reward != null && isNum(p.profitWindow) && isNum(p.bestDayPct)) {
      const dayAfter = num(p.todayNet, 0) + out.reward;
      const totalAfter = num(p.profitWindow, 0) + out.reward;
      const best = Math.max(num(p.bestDay, 0), dayAfter);
      if (totalAfter > 0) out.bestDayShare = Math.round((best / totalAfter) * 1000) / 10;
    }
    return out;
  }

  /* ---------------------------------------------------------------
     Account ledger: rebuilds the balance, the end-of-day trailing
     floor and each day's daily-drawdown limit from logged trades.
     --------------------------------------------------------------- */
  /**
   * account: { size, startDate, rules }
   * trades:  [{ id, closeTs|openTs, ... }]  (only trades for this account)
   * events:  [{ id, type:'payout'|'adjust', ts, amount, note }]
   * dayDocs: { 'YYYY-MM-DD': { dailyLimit?, floor?, sodBalance? } } dashboard overrides
   */
  function buildLedger(account, trades, events, dayDocs, settings, nowMs) {
    const R = account.rules;
    const size = num(account.size, 25000);
    const resetH = num(R.resetHourET, 17);
    const trailAmt = r2(size * num(R.trailingPct, 3) / 100);
    const lockAt = r2(size + num(R.lockOffset, 100));
    const mtl = r2(size * num(R.maxTradeLossPct, 1.5) / 100);
    const qualMin = r2(size * num(R.qualDayPct, 0.5) / 100);
    dayDocs = dayDocs || {};

    const items = [];
    for (const t of trades) {
      const c = tradeCalc(t, settings);
      const ms = c.closeMs || Date.parse(t.closeTs || t.openTs || 0);
      if (!Number.isFinite(ms)) continue;
      items.push({ kind: 'trade', ms, day: tradingDay(ms, resetH), utcDay: isoOf(ms), amount: c.net, t, c });
    }
    for (const e of events) {
      const ms = Date.parse(e.ts);
      if (!Number.isFinite(ms)) continue;
      const amt = e.type === 'payout' ? -Math.abs(num(e.amount)) : num(e.amount);
      items.push({ kind: e.type, ms, day: tradingDay(ms, resetH), utcDay: isoOf(ms), amount: r2(amt), e });
    }
    items.sort((a, b) => a.ms - b.ms);

    const today = tradingDay(nowMs, resetH);
    const dayKeys = [...new Set(items.map((x) => x.day))];
    if (!dayKeys.includes(today)) dayKeys.push(today);
    dayKeys.sort();

    // an unknown mode has always behaved as 'both'; name it so rtCap and riskNow agree
    const mode = R.trailingMode === 'eod' || R.trailingMode === 'rt' ? R.trailingMode : 'both';
    const rtLock = r2(size + num(R.rtLockOffset, 0));
    const dPct = num(R.dailyPct, 2) / 100;
    const lockLevel = mode === 'eod' ? lockAt : mode === 'rt' ? rtLock : Math.max(lockAt, rtLock);
    // in 'both' the real-time reading also stops at the stricter lock level, not at rtLock
    const rtCap = mode === 'both' ? lockLevel : rtLock;
    // dashboard values typed on days without trades still count from then on
    const ovKeys = Object.keys(dayDocs).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    let ovIdx = 0;
    let bal = size, maxEod = size, peak = size, lastPayoutDay = null, lastPayoutMs = null, lastPayoutBal = null;
    let hwmMax = -Infinity, prevFloor = -Infinity;
    const days = [];
    for (const day of dayKeys) {
      for (; ovIdx < ovKeys.length && ovKeys[ovIdx] <= day; ovIdx++) {
        const o = dayDocs[ovKeys[ovIdx]] || {};
        // the dashboard HWM is evidence of the real peak, on that day and every day after
        if (isNum(o.hwm)) hwmMax = Math.max(hwmMax, +o.hwm);
        if (ovKeys[ovIdx] < day && isNum(o.floor)) prevFloor = Math.max(prevFloor, +o.floor);
      }
      if (mode !== 'eod' && hwmMax > peak) peak = hwmMax;
      const its = items.filter((x) => x.day === day);
      const ov = dayDocs[day] || {};
      const startBal = bal;
      // EOD reading: highest end-of-day balance minus 3%, capped at start + $100
      const eodFloor = r2(Math.min(maxEod - trailAmt, lockAt));
      // real-time reading: highest balance seen so far (intraday included)
      const rtFloor = r2(Math.min(peak - trailAmt, rtCap));
      let floorCalc = mode === 'eod' ? eodFloor : mode === 'rt' ? rtFloor : Math.max(eodFloor, rtFloor);
      if (hwmMax > -Infinity) floorCalc = Math.max(floorCalc, Math.min(hwmMax - trailAmt, lockLevel));
      // ratchet: the floor never moves down
      floorCalc = r2(Math.max(floorCalc, prevFloor));
      // typed dashboard values only ever tighten
      const floorTyped = isNum(ov.floor);
      const floor = floorTyped ? r2(Math.max(+ov.floor, floorCalc)) : floorCalc;
      // the snapshot is the higher of equity or balance at 5 PM ET: an open profit typed on the
      // previous session and never cleared means a position was likely held through the reset
      const prevTd = prevTradingDay(day);
      const carried = isNum((dayDocs[prevTd] || {}).openPnl) ? +dayDocs[prevTd].openPnl : 0;
      let base = isNum(ov.sodBalance) ? Math.max(+ov.sodBalance, startBal) : startBal;
      if (carried > 0) base = Math.max(base, r2(startBal + carried));
      // articles say both "2% of account size" and "reset value x (1 - 2%)": use the stricter
      const dailyCalc = r2(Math.max(base * (1 - dPct), base - size * dPct));
      const dailyTyped = isNum(ov.dailyLimit);
      const dailyLimit = dailyTyped ? r2(Math.max(+ov.dailyLimit, dailyCalc)) : dailyCalc;
      let minBal = bal, net = 0, gross = 0, fees = 0, n = 0, wins = 0, losses = 0, payoutToday = 0;
      let dailyHit = null, trailHit = null;
      const flags = [];
      for (const x of its) {
        bal = r2(bal + x.amount);
        if (x.kind === 'trade') {
          net = r2(net + x.amount); gross = r2(gross + num(x.c.gross)); fees = r2(fees + x.c.fees); n++;
          if (x.amount > 0) wins++; else if (x.amount < 0) losses++;
          if (num(x.c.gross) <= -mtl + 0.005) flags.push({ type: 'mtl', id: x.t.id, msg: `Trade lost $${Math.abs(x.c.gross).toFixed(2)}, at or over the $${mtl.toFixed(0)} max trade loss (hard breach).` });
          else if (num(x.c.gross) <= -mtl * 0.9) flags.push({ type: 'mtl-near', id: x.t.id, msg: `Trade lost $${Math.abs(x.c.gross).toFixed(2)}, within 10% of the $${mtl.toFixed(0)} max trade loss.` });
          if (num(R.minHoldSec) > 0 && !x.t.rollover && x.c.holdSec != null && x.c.holdSec < R.minHoldSec) flags.push({ type: 'hold', id: x.t.id, msg: `Held ${x.c.holdSec}s, under the ${R.minHoldSec}s minimum.` });
          // only a losing trade can breach; a payout or adjustment alone never creates a breach flag
          if (x.amount < 0) {
            const liveFloor = mode === 'eod' ? floor : r2(Math.max(floor, Math.min(peak - trailAmt, rtCap)));
            if (bal <= dailyLimit + 1e-9 && (dailyHit == null || bal < dailyHit)) dailyHit = bal;
            if (bal <= liveFloor + 1e-9 && (trailHit == null || bal < trailHit.bal)) trailHit = { bal, floor: liveFloor };
          }
        }
        if (bal > peak && mode !== 'eod') peak = bal;
        if (x.kind === 'payout') { lastPayoutDay = day; lastPayoutMs = x.ms; lastPayoutBal = bal; payoutToday = r2(payoutToday - x.amount); }
        if (bal < minBal) minBal = bal;
      }
      if (dailyHit != null) flags.push({ type: 'daily', msg: `Closed balance reached $${dailyHit.toFixed(2)}, at or below the daily limit $${dailyLimit.toFixed(2)}.` });
      if (trailHit) flags.push({ type: 'trail', msg: `Closed balance reached $${trailHit.bal.toFixed(2)}, at or below the trailing floor $${trailHit.floor.toFixed(2)}.` });
      const done = day < today;
      // live floor: under the real-time reading, today's own closed-balance peak can lift it intraday
      const floorLive = mode === 'eod' ? floor : r2(Math.max(floor, Math.min(peak - trailAmt, rtCap)));
      const row = {
        day, startBal, endBal: bal, minBal, net, gross, fees, n, wins, losses,
        floor, floorLive, floorCalc, floorTyped, dailyLimit, dailyCalc, dailyTyped, flags, done, isToday: day === today,
        snapshot: r2(base), carriedOpen: carried,
        qualifying: qualMin > 0 && net >= qualMin - 1e-9 && n > 0,
        payoutDay: its.some((x) => x.kind === 'payout'), payoutToday,
      };
      days.push(row);
      prevFloor = Math.max(prevFloor, floorLive);
      if (done && bal > maxEod) maxEod = bal;
    }
    const todayRow = days.find((d) => d.day === today);
    const eodNext = Math.min(Math.max(maxEod, todayRow.endBal) - trailAmt, lockAt);
    const rtNow = Math.min(peak - trailAmt, rtCap);
    const nextCalc = mode === 'eod' ? eodNext : mode === 'rt' ? rtNow : Math.max(eodNext, rtNow);
    const nextFloor = r2(Math.max(nextCalc, todayRow.floorLive));
    return {
      size, trailAmt, lockAt, rtLock, rtCap, lockLevel, mode, mtl, qualMin, today, nowMs, days, todayRow,
      balance: bal, maxEod, peak, nextFloor, locked: todayRow.floorLive >= lockLevel - 1e-9,
      lastPayoutDay, lastPayoutMs, lastPayoutBal, items,
    };
  }

  /** Live risk picture for right now (equity may include open P&L). */
  function riskNow(ledger, openPnl) {
    const t = ledger.todayRow;
    let floor = num(t.floorLive, t.floor);
    const equity = r2(ledger.balance + num(openPnl, 0));
    // under a real-time reading, current equity is itself a peak the floor trails (never lowers it)
    if (ledger.mode !== 'eod') {
      const rtCap = ledger.mode === 'rt' ? ledger.rtLock : ledger.lockLevel;
      floor = r2(Math.max(floor, Math.min(equity - ledger.trailAmt, rtCap)));
    }
    const dailyRoom = r2(equity - t.dailyLimit);
    const trailRoom = r2(equity - floor);
    const room = Math.min(dailyRoom, trailRoom);
    const binding = dailyRoom <= trailRoom ? 'daily' : 'trail';
    const allowance = r2(num(t.snapshot, t.startBal) - t.dailyLimit);
    return { equity, floor, dailyRoom, trailRoom, room: r2(room), binding, floorAbs: Math.max(t.dailyLimit, floor), allowance };
  }

  /* ---------------------------------------------------------------
     Payout eligibility (Vanguard):
     - first payout: N days with >= qualDayPct profit (not consecutive)
     - every payout: >= 1% profit since the last payout, best day <= 20%
       of the profit in the window, all positions closed, >= $100.
     --------------------------------------------------------------- */
  /** Sum trade items per day key ('day' = CME trading day, 'utcDay' = UTC date), oldest first. */
  function groupDays(list, key) {
    const m = new Map();
    for (const x of list) {
      const g = m.get(x[key]) || { day: x[key], net: 0, n: 0 };
      g.net = r2(g.net + x.amount); g.n++;
      m.set(x[key], g);
    }
    return [...m.values()].sort((a, b) => (a.day < b.day ? -1 : a.day > b.day ? 1 : 0));
  }
  function payoutStatus(ledger, account, events, nowMs) {
    const R = account.rules;
    const size = ledger.size;
    const now = isNum(nowMs) ? +nowMs : isNum(ledger.nowMs) ? +ledger.nowMs : Date.now();
    const curDay = tradingDay(now, num(R.resetHourET, 17));
    const curUtc = isoOf(now);
    const payouts = (events || []).filter((e) => e.type === 'payout').sort((a, b) => Date.parse(a.ts) - Date.parse(b.ts));
    const first = payouts.length === 0;
    const capPct = num(R.bestDayPct, 20);
    const qualMin = num(ledger.qualMin, 0);
    const trades = ledger.items.filter((x) => x.kind === 'trade');
    // window = trades closed after the last payout's timestamp, so a payout day's later trades belong to the new window
    const since = ledger.lastPayoutMs;
    const win = since == null ? trades : trades.filter((x) => x.ms > since);
    const windowStart = ledger.lastPayoutBal != null ? ledger.lastPayoutBal : size;
    const profit = r2(ledger.balance - num(windowStart, size));
    const tradedProfit = win.reduce((a, x) => r2(a + x.amount), 0);
    // no article states the day clock for payouts: check the CME day and the UTC day and use the worse
    const winCme = groupDays(win, 'day'), winUtc = groupDays(win, 'utcDay');
    const bestOf = (ds, clock) => ds.reduce((m, d) => (d.net > m.net ? Object.assign({}, d, { clock }) : m), { net: 0, day: null, n: 0, clock });
    const bestCme = bestOf(winCme, 'cme'), bestUtc = bestOf(winUtc, 'utc');
    const best = bestUtc.net > bestCme.net ? bestUtc : bestCme;
    // decide on unrounded values; round the displayed share UP so a failing ratio never shows as the cap
    const fits = (b, tot) => tot > 0 && b <= (tot * capPct) / 100 + 1e-9;
    const shareOf = (b, tot) => (tot > 0 ? Math.ceil(((b * 100) / tot) * 10 - 1e-9) / 10 : null);
    const bestOk = fits(best.net, tradedProfit);
    const share = shareOf(best.net, tradedProfit);
    const needTotal = best.net > 0 ? r2(best.net / (capPct / 100)) : 0;
    const needMore = Math.max(0, r2(needTotal - tradedProfit));
    // qualifying days: only days that have closed count, and the lower of the two groupings wins
    const isQual = (d) => qualMin > 0 && d.n > 0 && d.net >= qualMin - 1e-9;
    const lifeCme = groupDays(trades, 'day'), lifeUtc = groupDays(trades, 'utcDay');
    const qualDays = ledger.days.filter((d) => d.qualifying && d.day < curDay);
    const qualCountCme = qualDays.length;
    const qualCountUtc = lifeUtc.filter((d) => d.day < curUtc && isQual(d)).length;
    const qualCount = Math.min(qualCountCme, qualCountUtc);
    const todayLife = lifeCme.find((d) => d.day === curDay) || { net: 0, n: 0 };
    const qualToday = { net: todayLife.net, onTrack: isQual(todayLife) };
    const minProfit = r2(size * num(R.minProfitSincePayoutPct, 1) / 100);
    // how much today can add before it becomes a best day over the cap, judged against earlier window days only
    const prior = winCme.filter((d) => d.day < curDay);
    const priorProfit = prior.reduce((a, d) => r2(a + d.net), 0);
    const bestPrior = prior.reduce((m, d) => Math.max(m, d.net), 0);
    const todayCap = priorProfit > 0 ? r2(Math.max(bestPrior, (priorProfit * capPct) / (100 - capPct))) : 0;
    const todayProfit = winCme.filter((d) => d.day === curDay).reduce((a, d) => r2(a + d.net), 0);
    // per-payout cap by payout number; profit above the cap stays in the account for later
    const caps = Array.isArray(R.payoutCaps) ? R.payoutCaps : [];
    const cap = payouts.length < caps.length ? num(caps[payouts.length], null) : null;
    const available = r2(Math.max(0, ledger.balance - size));
    const maxRequest = r2(cap == null ? available : Math.min(cap, available));
    const split = num(R.splitPct, 100) / 100;
    const needDays = num(R.firstPayoutDays, 0);
    const reqs = [];
    if (first && needDays > 0) reqs.push({ key: 'days', label: `${R.firstPayoutDays} trading days of at least $${qualMin.toFixed(0)} profit (first payout only)`, have: qualCount, need: needDays, met: qualCount >= needDays });
    reqs.push({ key: 'profit', label: `At least $${minProfit.toFixed(0)} profit since ${first ? 'the start' : 'your last payout'}`, have: profit, need: minProfit, met: profit >= minProfit - 1e-9, money: true });
    reqs.push({ key: 'best', label: `Best day no more than ${capPct}% of profit since ${first ? 'the start' : 'your last payout'}`, have: share, need: capPct, met: bestOk, pct: true });
    let lifeShare = null;
    if (!first) {
      // rulebook BEST DAY BASE: some articles use total profit at the request, so both bases must pass
      const lifeProfit = trades.reduce((a, x) => r2(a + x.amount), 0);
      const lifeBest = Math.max(bestOf(lifeCme, 'cme').net, bestOf(lifeUtc, 'utc').net);
      lifeShare = shareOf(lifeBest, lifeProfit);
      reqs.push({ key: 'best-total', label: `Best day no more than ${capPct}% of total profit since the start (some articles use this base)`, have: lifeShare, need: capPct, met: fits(lifeBest, lifeProfit), pct: true });
    }
    reqs.push({ key: 'min', label: `Payout of at least $${num(R.minPayout, 100).toFixed(0)} (your share)`, have: r2(maxRequest * split), need: num(R.minPayout, 100), met: maxRequest * split >= num(R.minPayout, 100) - 1e-9, money: true });
    if (!first && needDays > 0) {
      // articles: first payout only; the dashboard says "5 trading days" without that, so track it without blocking
      const have = Math.min(winCme.filter((d) => d.day < curDay && isQual(d)).length, winUtc.filter((d) => d.day < curUtc && isQual(d)).length);
      reqs.push({ key: 'days-since', info: true, label: `${needDays} days of $${qualMin.toFixed(0)}+ since your last payout (articles: first payout only; dashboard wording unclear)`, have, need: needDays, met: have >= needDays });
    }
    reqs.push({ key: 'flat', label: 'All positions closed and no working orders when you request', manual: true });
    if (first) reqs.push({ key: 'kyc', label: 'KYC done and Traders Agreement signed in the dashboard (one time)', manual: true });
    reqs.push({ key: 'name', label: 'Bank account or crypto wallet is in your own verified name', manual: true });
    return {
      first, payouts, windowStart, profit, tradedProfit, best, bestCme, bestUtc, share,
      shareCme: shareOf(bestCme.net, tradedProfit), shareUtc: shareOf(bestUtc.net, tradedProfit), lifeShare, needMore,
      qualDays, qualCount, qualCountCme, qualCountUtc, qualToday, minProfit,
      todayCap, todayProfit, reqs, cap, payoutNo: payouts.length + 1, available, maxRequest,
      windowDays: winCme, windowDaysUtc: winUtc, curDay,
      eligible: reqs.filter((r) => !r.manual && !r.info).every((r) => r.met),
    };
  }
  /** Inactivity clock: the account closes N calendar days after the later of purchase and the last closed trade. */
  function inactivity(ledger, account, nowMs) {
    const now = isNum(nowMs) ? +nowMs : isNum(ledger.nowMs) ? +ledger.nowMs : Date.now();
    const R = (account && account.rules) || {};
    // rollover legs are platform housekeeping, not a genuine closed trade, so they do not reset the clock
    const lastCloseMs = ledger.items.reduce((m, x) => (x.kind === 'trade' && !(x.t && x.t.rollover) && (m == null || x.ms > m) ? x.ms : m), null);
    let startMs = account && account.startTs ? Date.parse(account.startTs) : NaN;
    if (!Number.isFinite(startMs) && account && /^\d{4}-\d{2}-\d{2}$/.test(String(account.startDate || ''))) {
      const [y, mo, d] = account.startDate.split('-').map(Number);
      startMs = etToUtc(y, mo, d, 0, 0);
    }
    if (!Number.isFinite(startMs)) startMs = null;
    const from = Math.max(lastCloseMs == null ? -Infinity : lastCloseMs, startMs == null ? -Infinity : startMs);
    const deadlineMs = Number.isFinite(from) ? from + num(R.inactivityDays, 14) * DAY : null;
    const msLeft = deadlineMs == null ? null : deadlineMs - now;
    return { lastCloseMs, startMs, deadlineMs, msLeft, daysLeft: msLeft == null ? null : msLeft / DAY };
  }
  function payoutNet(amount, rules, method) {
    const gross = r2(num(amount) * num(rules.splitPct, 100) / 100);
    const pct = method === 'crypto-low' || method === 'bank' ? num(rules.payoutFeePct, 2.49) : 30;
    const fee = r2(num(rules.payoutFeeFixed, 19.9) + gross * pct / 100);
    return { gross, fee, net: r2(Math.max(0, gross - fee)), pct };
  }

  /* ---------------------------------------------------------------
     Statistics
     --------------------------------------------------------------- */
  function stats(trades, settings, resetH = 17) {
    const rows = trades.filter((t) => !t.rollover).map((t) => ({ t, c: tradeCalc(t, settings) }))
      .filter((x) => x.c.closeMs)
      .sort((a, b) => a.c.closeMs - b.c.closeMs);
    const n = rows.length;
    const nets = rows.map((x) => x.c.net);
    const winsA = nets.filter((x) => x > 0), lossA = nets.filter((x) => x < 0);
    const sum = (a) => r2(a.reduce((s, x) => s + x, 0));
    const gp = sum(winsA), gl = Math.abs(sum(lossA));
    let streakW = 0, streakL = 0, maxW = 0, maxL = 0, peak = 0, eq = 0, maxDD = 0;
    for (const v of nets) {
      if (v > 0) { streakW++; streakL = 0; } else if (v < 0) { streakL++; streakW = 0; }
      maxW = Math.max(maxW, streakW); maxL = Math.max(maxL, streakL);
      eq = r2(eq + v); peak = Math.max(peak, eq); maxDD = Math.max(maxDD, r2(peak - eq));
    }
    const Rs = rows.map((x) => x.c.R).filter((x) => x != null);
    const holds = rows.map((x) => x.c.holdSec).filter((x) => x != null);
    const group = (keyFn) => {
      const m = new Map();
      for (const x of rows) {
        const k = keyFn(x);
        if (k == null || k === '') continue;
        const ks = Array.isArray(k) ? k : [k];
        for (const kk of ks) {
          const g = m.get(kk) || { key: kk, n: 0, net: 0, wins: 0, losses: 0 };
          g.n++; g.net = r2(g.net + x.c.net);
          if (x.c.net > 0) g.wins++; else if (x.c.net < 0) g.losses++;

<script>
/* Vanguard 25K Desk: storage.
   Data can live in three places:
   - cloud:  the claude.ai artifact's private database, when the page is opened on claude.ai
   - local:  this browser (localStorage + IndexedDB for screenshots), on the public site
   - GitHub: optional sync of the local copy to a private repo the trader owns, for several devices
   Rules that keep data safe:
   - every cloud write goes into an outbox first and leaves it only once saved
   - every copy is merged, never overwritten: newest edit wins per record (per field for day notes),

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const lsGet = (k) => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } };

  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };
  const clean = (o) => JSON.parse(JSON.stringify(o, (k, v) => (typeof v === 'number' && !Number.isFinite(v) ? null : v)));
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const ID_RE = /^[A-Za-z0-9_.~:@+-]{1,180}$/;
  const maxIso = (a, b) => ((a || '') > (b || '') ? a : b);

  // timestamps that never go backwards on this device, and always beat the record being replaced
  let lastTs = '';

  /* ---------- UTF-8 base64 for the GitHub contents API ---------- */
  function bytesToB64(bytes) {

    return btoa(s);

  const textToB64 = (text) => bytesToB64(new TextEncoder().encode(text));
  function b64ToBytes(b64) {
    const bin = atob(String(b64).replace(/\s+/g, ''));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

  }

  /* ---------- IndexedDB for screenshots on the public site ---------- */
  let idbP = null;
  function idb() {
    if (idbP) return idbP;
    idbP = new Promise((resolve, reject) => {
      try {
        const rq = indexedDB.open('v25k-images', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('img');
        rq.onsuccess = () => resolve(rq.result);
        rq.onerror = () => reject(rq.error);
      } catch (e) { reject(e); }
    });
    return idbP;
  }
  async function idbOp(mode, fn) {
    const d = await idb();
    return new Promise((resolve, reject) => {
      const tx = d.transaction('img', mode);
      const rq = fn(tx.objectStore('img'));
      tx.oncomplete = () => resolve(rq && rq.result);
      tx.onerror = () => reject(tx.error);
    });
  }
  const idbPut = (id, blob) => idbOp('readwrite', (s) => s.put(blob, id));
  const idbGet = (id) => idbOp('readonly', (s) => s.get(id));
  const idbDel = (id) => idbOp('readwrite', (s) => s.delete(id));

  /* ---------- merging two copies of the journal ---------- */
  // settings come from the newer copy, but no account is ever dropped
  function mergeApp(la, ra) {
    if (!ra) return la;
    if (!la) return ra;
    const win = (ra.updated || '') > (la.updated || '') ? ra : la;
    const lose = win === la ? ra : la;
    const ids = new Set((win.accounts || []).map((a) => a && a.id));
    const extra = (lose.accounts || []).filter((a) => a && !ids.has(a.id));
    return extra.length ? Object.assign({}, win, { accounts: (win.accounts || []).concat(extra) }) : win;
  }
  // day notes merge field by field using the per-field stamps in `fu`
  function mergeDay(x, y) {
    const base = (x.updated || '') >= (y.updated || '') ? x : y;
    const other = base === x ? y : x;
    const out = JSON.parse(JSON.stringify(base));
    const fb = base.fu || {}, fo = other.fu || {};
    out.fu = Object.assign({}, fo, fb);
    for (const [k, t] of Object.entries(fo)) {
      if (t <= (fb[k] || '')) continue;
      out.fu[k] = t;
      if (k.startsWith('checks.')) {
        const ck = k.slice(7);
        out.checks = Object.assign({}, out.checks || {});
        const v = (other.checks || {})[ck];
        if (v === undefined) delete out.checks[ck]; else out.checks[ck] = v;
      } else if (other[k] === undefined) delete out[k];

  }
  function mergeData(local, remote) {
    if (!remote) return local;
    const out = { app: mergeApp(local.app, remote.app), tomb: {} };
    const tombs = Object.assign({}, remote.tomb || {});
    for (const [k, v] of Object.entries(local.tomb || {})) if (!tombs[k] || v > tombs[k]) tombs[k] = v;

    if (out.app && (out.app.accounts || []).some((a) => a && tombs['accounts/' + a.id])) {
      out.app = Object.assign({}, out.app, { accounts: out.app.accounts.filter((a) => a && !tombs['accounts/' + a.id]) });
    }
    for (const coll of COLLS) {
      const m = new Map();
      for (const x of remote[coll] || []) if (x && x.id) m.set(x.id, x);
      for (const x of local[coll] || []) {
        if (!x || !x.id) continue;
        const r = m.get(x.id);
        if (!r) m.set(x.id, x);
        else if (coll === 'days') m.set(x.id, mergeDay(x, r));
        else if ((x.updated || '') >= (r.updated || '')) m.set(x.id, x);

      for (const [id, x] of m) { const t = tombs[coll + '/' + id]; if (t && t >= (x.updated || '')) m.delete(id); }

  }
  const sig = (d) => JSON.stringify([d.app || null, ...COLLS.map((c) => (d[c] || []).slice().sort((a, b) => (a.id < b.id ? -1 : 1)))]);

  function create(S, H) {
    // H: { notify(), toast(msg, ms), migrateApp(a), sanitize(coll, doc) -> doc|null }
    const st = {
      mode: 'loading', // loading | cloud | local | offline
      readOnly: false, unreachable: false, pending: 0, error: null, liveDead: false,
      outbox: 0, gh: lsGet(LS.gh), ghState: 'off', ghLast: null, ghError: null,
    };
    let db = null, assets = null;
    const queues = new Map();
    const inflight = new Set();
    let appTimer = null, cacheTimer = null, ghTimer = null, ghBusy = false, ghAgain = false, resubscribed = false, pollStarted = false;
    let unsubs = [];
    let outbox = lsGet(LS.outbox) || {};
    let tomb = lsGet(LS.tomb) || {};
    const urlCache = new Map();
    st.outbox = Object.keys(outbox).length;
    if (st.gh) st.ghState = 'idle';

    const notify = () => { st.outbox = Object.keys(outbox).length; H.notify(); };
    const saveOutbox = () => { lsSet(LS.outbox, outbox); st.outbox = Object.keys(outbox).length; };

    function snapshotAll() {
      return { app: S.app, trades: [...S.trades.values()], days: [...S.days.values()], events: [...S.events.values()] };
    }
    function sanitizeList(coll, list) {
      const m = new Map();
      for (const x of list || []) {
        if (!x || typeof x.id !== 'string' || !ID_RE.test(x.id)) continue;
        const y = H.sanitize(coll, x);
        if (y) m.set(y.id, y);
      }
      return m;
    }
    const canon = (d) => ({ app: d && d.app ? H.migrateApp(d.app) : null, trades: [...sanitizeList('trades', d && d.trades).values()], days: [...sanitizeList('days', d && d.days).values()], events: [...sanitizeList('events', d && d.events).values()] });
    function hydrate(d) {
      if (!d) return;
      S.app = d.app ? H.migrateApp(d.app) : null;
      for (const c of COLLS) S[c] = sanitizeList(c, d[c]);

    function overlayOutbox() {
      for (const e of Object.values(outbox)) {

        if (!S[e.coll]) continue;
        if (e.op === 'put') S[e.coll].set(e.id, e.doc);
        else if (e.op === 'del') S[e.coll].delete(e.id);

    }

    function dropOutbox(key, entry) { if (outbox[key] && (!entry || outbox[key].seq === entry.seq)) { delete outbox[key]; saveOutbox(); } }

    /* ---------- startup ---------- */
    async function init() {
      const inFrame = !!(window.claude && typeof window.claude.use === 'function');
      loadOptional(inFrame);
      if (!inFrame) { goLocal(); return; }
      const cached = lsGet(LS.cache);
      if (cached) { hydrate(cached); overlayOutbox(); notify(); }
      let dbx = null;
      try { dbx = await window.claude.use('db'); } catch (e) { dbx = null; }
      if (!dbx) return goOffline();
      db = dbx;

        const user = await window.claude.use('user').catch(() => null);
        if (user) { const can = await user.canEdit().catch(() => null); if (can === false) st.readOnly = true; }
        let first = null, lastErr = null;
        for (const wait of [0, 500, 1500, 4000]) {
          if (wait) await sleep(wait + jitter(0, 400));
          try { first = await db.doc('desk/main').get(); break; } catch (e) {
            lastErr = e;
            if (e && ['invalid_argument', 'revoked', 'not_granted'].includes(e.code)) break;

        S.ready = true;
        overlayOutbox();
        notify();
        flushOutbox();
        const local = lsGet(LS.local);
        if (local && ((local.trades && local.trades.length) || (local.events && local.events.length))) S.flags.pendingLocal = local;

    }
    async function loadOptional(inFrame) {

      try { assets = await window.claude.use('assets'); } catch (e) { assets = null; }
      S.flags.assets = assets;
      try { S.flags.downloads = await window.claude.use('downloads'); } catch (e) { S.flags.downloads = null; }
      try { S.flags.sample = await window.claude.use('sample'); } catch (e) { S.flags.sample = null; }

    }

    function goOffline() { st.mode = 'offline'; st.readOnly = true; st.unreachable = true; S.ready = true; notify(); }
    function goLocal() {

    }

        if (!s.exists) return;
        // our own unsaved settings edit is newer: keep it

        S.app = H.migrateApp(mergeApp(S.app, s.data()));
        notify();
      }, onErr));
      for (const coll of COLLS) {
        unsubs.push(db.collection(coll).onSnapshot((q) => {
          const m = new Map();
          for (const d of q.docs) {

            if (y) m.set(d.id, y);

          notify();
        }, onErr));

    }

    /* ---------- writes ---------- */
    function enqueue(key, fn, entry) {
      const prev = queues.get(key) || Promise.resolve();
      st.pending++; notify();

        inflight.add(key);
        try {
          try { await fn(); }
          catch (e) {
            if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await sleep(jitter(600, 2000)); await fn(); }
            else throw e;

          return true;
        } catch (e) {
          st.error = e;
          const msg = e && e.code === 'quota_exceeded' ? 'Storage is full. Export a backup, then delete old trades.'
            : e && (e.code === 'invalid_argument' || e.code === 'not_granted') ? 'Only the owner can change this desk.'
              : 'Not saved to the cloud yet. It is kept on this device and will retry.';
          H.toast(msg, 5000);
          return false;
        } finally {
          inflight.delete(key);
          st.pending--; notify();
        }

          const doc = s.exists ? mergeApp(e.doc, s.data()) : e.doc;
          await db.doc('desk/main').set(clean(doc));
          if (s.exists && (doc.accounts || []).length > ((S.app && S.app.accounts) || []).length) { S.app = H.migrateApp(mergeApp(S.app, doc)); notify(); }
        }, e);
      }
      return enqueue(key, async () => {
        const ref = db.collection(e.coll).doc(e.id);
        if (e.replay) {
          const s = await ref.get();
          const mine = e.op === 'put' ? (e.doc.updated || '') : (e.ts || '');
          if (s.exists && (s.data().updated || '') > mine) return;
        }

      const entry = { op, coll, id, doc: op === 'put' ? clean(doc) : null, ts, seq: stamp() };
      addOutbox(key, entry); // write-ahead: survives a closed tab

      if (st.mode !== 'cloud') return Promise.resolve(false);

    function guard() {
      if (st.readOnly) { H.toast(st.mode === 'offline' ? 'Can’t reach your synced journal. Reload to try again.' : 'You can view this desk but not change it.', 4000); return false; }
      return true;
    }
    function put(coll, obj) {

      const prev = S[coll].get(obj.id);
      obj = Object.assign({}, obj, { updated: stamp(maxIso(prev && prev.updated, tomb[coll + '/' + obj.id])) });
      S[coll].set(obj.id, obj);
      delete tomb[coll + '/' + obj.id];
      notify();
      if (st.mode === 'local') { saveLocal(); ghSoon(); return Promise.resolve(true); }
      return writeDoc(coll, obj.id, 'put', obj);
    }
    function del(coll, id) {

          try { good = await worker(x); } catch (e) { good = false; }
          if (good) ok++; else failed++;
          done++;
          if (onProgress) { try { onProgress(done, list.length); } catch (e) { /* ignore UI errors */ } }
        }
      };
      await Promise.all([run(), run(), run()]);
      return { ok, failed };
    }
    async function putMany(coll, list, onProgress) {
      if (!guard()) return { ok: 0, failed: list.length };
      if (st.mode !== 'cloud') {
        for (const o of list) {
          const prev = S[coll].get(o.id);
          S[coll].set(o.id, Object.assign({}, o, { updated: stamp(prev && prev.updated) }));
          delete tomb[coll + '/' + o.id];
        }
        notify();
        if (st.mode === 'local') { saveLocal(); ghSoon(); }
        else for (const o of list) writeDoc(coll, o.id, 'put', S[coll].get(o.id));
        if (onProgress) { try { onProgress(list.length, list.length); } catch (e) { /* ignore */ } }
        return { ok: list.length, failed: 0 };
      }
      return pool(list, (o) => put(coll, o), onProgress);
    }
    async function delMany(coll, ids, onProgress) {
      if (!guard()) return { ok: 0, failed: ids.length };
      if (st.mode !== 'cloud') {
        for (const id of ids) { const prev = S[coll].get(id); S[coll].delete(id); tomb[coll + '/' + id] = stamp(prev && prev.updated); }
        notify();
        if (st.mode === 'local') { saveLocal(); ghSoon(); }

      }
      return pool(ids, (id) => del(coll, id), onProgress);
    }
    function saveApp(now) {
      if (!guard()) return Promise.resolve(false);
      S.app.updated = stamp(S.app.updated);
      notify();
      if (st.mode === 'local') { saveLocal(); ghSoon(); return Promise.resolve(true); }
      const go = () => {
        appTimer = null;
        const entry = { op: 'app', coll: 'desk', id: 'main', doc: clean(S.app), seq: stamp() };
        addOutbox('desk/main', entry);
        if (st.mode !== 'cloud') return Promise.resolve(st.mode === 'loading');

    function flushApp() { if (appTimer) { clearTimeout(appTimer); appTimer = null; saveApp(true); } }

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushApp(); });

    function flushOutbox() {

      }
    }
    // local mode: merge with what another tab may have saved, then write
    function saveLocal() {
      if (st.mode !== 'local') return;
      let cur = Object.assign(snapshotAll(), { tomb });
      const disk = lsGet(LS.local);
      if (disk) {
        const merged = mergeData(cur, Object.assign({}, disk, { tomb: lsGet(LS.tomb) || {} }));
        if (sig(canon(merged)) !== sig(canon(cur))) { hydrate(merged); setTimeout(notify, 0); }
        tomb = merged.tomb;
        cur = merged;
      }

    }
    function cacheSoon() {
      if (st.mode !== 'cloud') return;
      clearTimeout(cacheTimer);
      cacheTimer = setTimeout(() => lsSet(LS.cache, snapshotAll()), 800);
    }

    /* ---------- screenshots ---------- */
    async function saveImage(blob) {
      if (st.mode === 'cloud' && assets) {
        const res = await assets.upload(blob);
        return { id: res.id, src: 'asset' };
      }
      const id = uid('img_');
      await idbPut(id, blob);
      if (st.gh) { queueImages([id]); ghSoon(); }
      return { id, src: 'local' };
    }
    function queueImages(ids) {
      const done = new Set(lsGet(LS.imgdone) || []);
      const q = new Set(lsGet(LS.imgq) || []);
      for (const id of ids) if (!done.has(id)) q.add(id);
      lsSet(LS.imgq, [...q]);
    }
    // screenshots saved before sync was switched on still need uploading
    function queueLocalShots() {
      const ids = [];
      for (const t of S.trades.values()) for (const s of t.shots || []) if (s && s.id && (s.src === 'local' || !s.src)) ids.push(s.id);
      queueImages(ids);
    }
    async function imageUrl(shot) {
      if (!shot || !shot.id) return null;
      if (shot.src === 'asset' || (!shot.src && st.mode === 'cloud')) return '/_blob/' + shot.id;
      if (urlCache.has(shot.id)) return urlCache.get(shot.id);
      let blob = null;
      try { blob = await idbGet(shot.id); } catch (e) { blob = null; }
      if (!blob && st.gh) {
        try {
          const r = await ghFetch(`/repos/${st.gh.repo}/contents/shots/${shot.id}.jpg`, { accept: 'application/vnd.github.raw+json' });
          if (r.ok) { blob = await r.blob(); try { await idbPut(shot.id, blob); } catch (e) { /* ignore */ } }
        } catch (e) { blob = null; }
      }

    async function deleteImage(shot) {

        if (shot.src === 'asset' && assets) await assets.delete(shot.id);
        else await idbDel(shot.id);
      } catch (e) { /* ignore */ }

    /* ---------- GitHub sync (public site) ---------- */
    async function ghFetch(path, opts = {}) {

      const headers = { Authorization: 'Bearer ' + g.token, Accept: opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
      if (opts.body) headers['Content-Type'] = 'application/json';

    async function ghErr(r) {

      e.status = r.status;
      return e;
    }
    async function ghGetData() {
      const g = st.gh;
      const r = await ghFetch(`/repos/${g.repo}/contents/${DATA_FILE}`);
      if (r.status === 404) return { sha: null, data: null };
      if (!r.ok) throw await ghErr(r);
      const j = await r.json();
      let text;
      if (j.content && j.encoding === 'base64') text = new TextDecoder().decode(b64ToBytes(j.content));
      else {
        const r2 = await ghFetch(`/repos/${g.repo}/contents/${DATA_FILE}`, { accept: 'application/vnd.github.raw+json' });
        if (!r2.ok) throw await ghErr(r2);
        text = await r2.text();
      }
      let data = null;
      try { data = JSON.parse(text); } catch (e) { throw new Error('The journal file in GitHub is not valid JSON.'); }
      if (!data || data.format !== 'vanguard-desk') throw new Error('The GitHub file is not a Vanguard Desk journal.');
